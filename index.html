<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBY Energy - Contratação</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';

        function FormularioContratacao() {
            const [step, setStep] = useState(1);
            const [vendedores, setVendedores] = useState([]);
            const [loadingVendedores, setLoadingVendedores] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            
            const [formData, setFormData] = useState({
                // ✅ CORREÇÃO: Campo vendedor adicionado ao estado inicial
                vendedor: '',
                tipo_pessoa: 'fisica',
                nome: '',
                sobrenome: '',
                nome_fantasia: '',
                cpf: '',
                cnpj: '',
                email: '',
                telefone: '',
                cep: '',
                logradouro: '',
                numero_endereco: '',
                complemento: '',
                bairro: '',
                cidade: '',
                estado: '',
                consumo_kwh: '',
                distribuidora_energia: '',
                numero_instalacao: '',
                tipo_conexao: 'monofasico',
                status: 'pendente'
            });

            const [arquivos, setArquivos] = useState({
                conta_energia: null,
                rg_frente: null,
                rg_verso: null
            });

            useEffect(() => {
                carregarVendedores();
            }, []);

            const carregarVendedores = async () => {
                setLoadingVendedores(true);
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/vendedores?select=*&status=eq.ativo&order=nome_completo.asc`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        setVendedores(data || []);
                    }
                } catch (error) {
                    console.error('Erro ao carregar vendedores:', error);
                } finally {
                    setLoadingVendedores(false);
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleFileChange = (e) => {
                const { name, files } = e.target;
                if (files && files[0]) {
                    setArquivos(prev => ({ ...prev, [name]: files[0] }));
                }
            };

            const buscarCEP = async () => {
                if (formData.cep.length === 8) {
                    try {
                        const response = await fetch(`https://viacep.com.br/ws/${formData.cep}/json/`);
                        const data = await response.json();
                        if (!data.erro) {
                            setFormData(prev => ({
                                ...prev,
                                logradouro: data.logradouro,
                                bairro: data.bairro,
                                cidade: data.localidade,
                                estado: data.uf
                            }));
                        }
                    } catch (error) {
                        console.error('Erro ao buscar CEP:', error);
                    }
                }
            };

            const uploadArquivo = async (file, campo) => {
                const timestamp = Date.now();
                const fileName = `${campo}_${timestamp}_${file.name}`;
                
                const formDataUpload = new FormData();
                formDataUpload.append('file', file);

                try {
                    const response = await fetch(`${SUPABASE_URL}/storage/v1/object/propostas/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY
                        },
                        body: file
                    });

                    if (response.ok) {
                        return `${SUPABASE_URL}/storage/v1/object/public/propostas/${fileName}`;
                    }
                } catch (error) {
                    console.error('Erro ao fazer upload:', error);
                }
                return null;
            };

            const gerarNumeroContrato = (propostaId) => {
                const anoAtual = new Date().getFullYear();
                const idCurto = String(propostaId).slice(-5);
                return `OBY-${anoAtual}-${idCurto}`;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSubmitting(true);

                try {
                    // ✅ CORREÇÃO: Incluir o campo vendedor no payload
                    const payload = {
                        tipo_pessoa: formData.tipo_pessoa,
                        nome: formData.nome,
                        sobrenome: formData.sobrenome,
                        nome_fantasia: formData.tipo_pessoa === 'juridica' ? formData.nome_fantasia : null,
                        cpf: formData.tipo_pessoa === 'fisica' ? formData.cpf : null,
                        cnpj: formData.tipo_pessoa === 'juridica' ? formData.cnpj : null,
                        email: formData.email,
                        telefone: formData.telefone,
                        cep: formData.cep,
                        logradouro: formData.logradouro,
                        numero_endereco: formData.numero_endereco,
                        complemento: formData.complemento,
                        bairro: formData.bairro,
                        cidade: formData.cidade,
                        estado: formData.estado,
                        consumo_kwh: parseInt(formData.consumo_kwh),
                        distribuidora_energia: formData.distribuidora_energia,
                        numero_instalacao: formData.numero_instalacao,
                        tipo_conexao: formData.tipo_conexao,
                        status: 'pendente',
                        // ✅ CAMPO VENDEDOR INCLUÍDO AQUI!
                        vendedor: formData.vendedor
                    };

                    // Upload dos arquivos
                    if (arquivos.conta_energia) {
                        payload.arquivo_conta_url = await uploadArquivo(arquivos.conta_energia, 'conta');
                    }
                    if (arquivos.rg_frente) {
                        payload.rg_frente_url = await uploadArquivo(arquivos.rg_frente, 'rg_frente');
                    }
                    if (arquivos.rg_verso) {
                        payload.rg_verso_url = await uploadArquivo(arquivos.rg_verso, 'rg_verso');
                    }

                    // Criar proposta
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const propostaId = data[0].id;
                        
                        // Gerar e atualizar número do contrato
                        const numeroContrato = gerarNumeroContrato(propostaId);
                        
                        await fetch(`${SUPABASE_URL}/rest/v1/propostas?id=eq.${propostaId}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'apikey': SUPABASE_KEY,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ numero_contrato: numeroContrato })
                        });

                        alert(`✅ Proposta cadastrada com sucesso!\nNúmero do Contrato: ${numeroContrato}`);
                        
                        // Resetar formulário
                        setFormData({
                            vendedor: '',
                            tipo_pessoa: 'fisica',
                            nome: '',
                            sobrenome: '',
                            nome_fantasia: '',
                            cpf: '',
                            cnpj: '',
                            email: '',
                            telefone: '',
                            cep: '',
                            logradouro: '',
                            numero_endereco: '',
                            complemento: '',
                            bairro: '',
                            cidade: '',
                            estado: '',
                            consumo_kwh: '',
                            distribuidora_energia: '',
                            numero_instalacao: '',
                            tipo_conexao: 'monofasico',
                            status: 'pendente'
                        });
                        setArquivos({
                            conta_energia: null,
                            rg_frente: null,
                            rg_verso: null
                        });
                        setStep(1);
                    } else {
                        const error = await response.json();
                        alert('❌ Erro ao cadastrar proposta: ' + (error.message || 'Erro desconhecido'));
                    }
                } catch (error) {
                    alert('❌ Erro ao processar cadastro: ' + error.message);
                } finally {
                    setSubmitting(false);
                }
            };

            const nextStep = () => setStep(prev => Math.min(prev + 1, 5));
            const prevStep = () => setStep(prev => Math.max(prev - 1, 1));

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-blue-600 to-purple-600 p-8 text-white">
                                <h1 className="text-3xl font-bold mb-2">⚡ OBY Energy</h1>
                                <p className="text-blue-100">Preencha os dados para enviar sua contratação</p>
                            </div>

                            {/* Progress Bar */}
                            <div className="flex items-center justify-center p-6 bg-gray-50">
                                {[1, 2, 3, 4, 5].map((num) => (
                                    <React.Fragment key={num}>
                                        <div className={`flex items-center justify-center w-10 h-10 rounded-full font-bold ${step >= num ? 'bg-blue-600 text-white' : 'bg-gray-300 text-gray-600'}`}>
                                            {num}
                                        </div>
                                        {num < 5 && <div className={`w-16 h-1 ${step > num ? 'bg-blue-600' : 'bg-gray-300'}`} />}
                                    </React.Fragment>
                                ))}
                            </div>

                            {/* Form */}
                            <form onSubmit={handleSubmit} className="p-8">
                                {/* STEP 1: Informações do Cliente */}
                                {step === 1 && (
                                    <div className="space-y-6">
                                        <div className="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-400">
                                            <h2 className="text-xl font-bold text-blue-800 mb-4">👤 Informações do Cliente</h2>
                                        </div>

                                        {/* ✅ CORREÇÃO: Select de Vendedor */}
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Vendedor *
                                            </label>
                                            {loadingVendedores ? (
                                                <p className="text-gray-500">Carregando vendedores...</p>
                                            ) : (
                                                <select
                                                    name="vendedor"
                                                    value={formData.vendedor}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                                >
                                                    <option value="">Selecione um vendedor</option>
                                                    {vendedores.map((v) => (
                                                        <option key={v.id} value={v.nome_completo}>
                                                            {v.codigo_vendedor} - {v.nome_completo}
                                                        </option>
                                                    ))}
                                                </select>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">CEP *</label>
                                                <div className="flex gap-2">
                                                    <input
                                                        type="text"
                                                        name="cep"
                                                        value={formData.cep}
                                                        onChange={handleChange}
                                                        maxLength="8"
                                                        required
                                                        className="flex-1 p-3 border border-gray-300 rounded-lg"
                                                    />
                                                    <button
                                                        type="button"
                                                        onClick={buscarCEP}
                                                        className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                                                    >
                                                        Validar
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Nome *</label>
                                                <input
                                                    type="text"
                                                    name="nome"
                                                    value={formData.nome}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Sobrenome *</label>
                                                <input
                                                    type="text"
                                                    name="sobrenome"
                                                    value={formData.sobrenome}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Email *</label>
                                                <input
                                                    type="email"
                                                    name="email"
                                                    value={formData.email}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Telefone *</label>
                                                <input
                                                    type="text"
                                                    name="telefone"
                                                    value={formData.telefone}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">CPF *</label>
                                            <input
                                                type="text"
                                                name="cpf"
                                                value={formData.cpf}
                                                onChange={handleChange}
                                                maxLength="14"
                                                required={formData.tipo_pessoa === 'fisica'}
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>
                                    </div>
                                )}

                                {/* STEP 2: Endereço */}
                                {step === 2 && (
                                    <div className="space-y-6">
                                        <div className="bg-green-50 p-4 rounded-lg border-l-4 border-green-400">
                                            <h2 className="text-xl font-bold text-green-800 mb-4">📍 Endereço</h2>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Logradouro *</label>
                                            <input
                                                type="text"
                                                name="logradouro"
                                                value={formData.logradouro}
                                                onChange={handleChange}
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Número *</label>
                                                <input
                                                    type="text"
                                                    name="numero_endereco"
                                                    value={formData.numero_endereco}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Complemento</label>
                                                <input
                                                    type="text"
                                                    name="complemento"
                                                    value={formData.complemento}
                                                    onChange={handleChange}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Bairro *</label>
                                                <input
                                                    type="text"
                                                    name="bairro"
                                                    value={formData.bairro}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Cidade *</label>
                                                <input
                                                    type="text"
                                                    name="cidade"
                                                    value={formData.cidade}
                                                    onChange={handleChange}
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Estado *</label>
                                                <input
                                                    type="text"
                                                    name="estado"
                                                    value={formData.estado}
                                                    onChange={handleChange}
                                                    maxLength="2"
                                                    required
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* STEP 3: Dados de Energia */}
                                {step === 3 && (
                                    <div className="space-y-6">
                                        <div className="bg-yellow-50 p-4 rounded-lg border-l-4 border-yellow-400">
                                            <h2 className="text-xl font-bold text-yellow-800 mb-4">⚡ Dados de Energia</h2>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Consumo Médio (kWh) *</label>
                                            <input
                                                type="number"
                                                name="consumo_kwh"
                                                value={formData.consumo_kwh}
                                                onChange={handleChange}
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Distribuidora de Energia *</label>
                                            <input
                                                type="text"
                                                name="distribuidora_energia"
                                                value={formData.distribuidora_energia}
                                                onChange={handleChange}
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Número de Instalação *</label>
                                            <input
                                                type="text"
                                                name="numero_instalacao"
                                                value={formData.numero_instalacao}
                                                onChange={handleChange}
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Tipo de Conexão *</label>
                                            <select
                                                name="tipo_conexao"
                                                value={formData.tipo_conexao}
                                                onChange={handleChange}
                                                required
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            >
                                                <option value="monofasico">Monofásico</option>
                                                <option value="bifasico">Bifásico</option>
                                                <option value="trifasico">Trifásico</option>
                                            </select>
                                        </div>
                                    </div>
                                )}

                                {/* STEP 4: Upload de Documentos */}
                                {step === 4 && (
                                    <div className="space-y-6">
                                        <div className="bg-purple-50 p-4 rounded-lg border-l-4 border-purple-400">
                                            <h2 className="text-xl font-bold text-purple-800 mb-4">📎 Upload de Documentos</h2>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Conta de Energia</label>
                                            <input
                                                type="file"
                                                name="conta_energia"
                                                onChange={handleFileChange}
                                                accept="image/*,application/pdf"
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">RG/CNH (Frente)</label>
                                            <input
                                                type="file"
                                                name="rg_frente"
                                                onChange={handleFileChange}
                                                accept="image/*,application/pdf"
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">RG/CNH (Verso)</label>
                                            <input
                                                type="file"
                                                name="rg_verso"
                                                onChange={handleFileChange}
                                                accept="image/*,application/pdf"
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>
                                    </div>
                                )}

                                {/* STEP 5: Revisão */}
                                {step === 5 && (
                                    <div className="space-y-6">
                                        <div className="bg-gray-50 p-4 rounded-lg border-l-4 border-gray-400">
                                            <h2 className="text-xl font-bold text-gray-800 mb-4">📋 Revisão dos Dados</h2>
                                        </div>

                                        <div className="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <p className="text-sm text-gray-600">Vendedor:</p>
                                                    <p className="font-semibold">{formData.vendedor || '-'}</p>
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-600">Nome:</p>
                                                    <p className="font-semibold">{formData.nome} {formData.sobrenome}</p>
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-600">Email:</p>
                                                    <p className="font-semibold">{formData.email}</p>
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-600">Cidade:</p>
                                                    <p className="font-semibold">{formData.cidade} - {formData.estado}</p>
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-600">Consumo:</p>
                                                    <p className="font-semibold">{formData.consumo_kwh} kWh</p>
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-600">Distribuidora:</p>
                                                    <p className="font-semibold">{formData.distribuidora_energia}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Navigation Buttons */}
                                <div className="flex justify-between mt-8 pt-6 border-t">
                                    {step > 1 && (
                                        <button
                                            type="button"
                                            onClick={prevStep}
                                            className="px-6 py-3 bg-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-400"
                                        >
                                            ← Anterior
                                        </button>
                                    )}
                                    {step < 5 && (
                                        <button
                                            type="button"
                                            onClick={nextStep}
                                            className="ml-auto px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700"
                                        >
                                            Próximo →
                                        </button>
                                    )}
                                    {step === 5 && (
                                        <button
                                            type="submit"
                                            disabled={submitting}
                                            className="ml-auto px-8 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 disabled:opacity-50"
                                        >
                                            {submitting ? '⏳ Enviando...' : '✅ Enviar Contratação'}
                                        </button>
                                    )}
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FormularioContratacao />, document.getElementById('root'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBY Energy - Simulação de Economia</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';

        function FormularioEnergia() {
            const [etapa, setEtapa] = useState(1);
            const [descontoPercentual, setDescontoPercentual] = useState(15); // Valor padrão
            const [loadingDesconto, setLoadingDesconto] = useState(true);
            
            // Dados do formulário
            const [formData, setFormData] = useState({
                // Etapa 1
                cep: '',
                nome: '',
                sobrenome: '',
                email: '',
                telefone: '',
                // Etapa 2
                tipoPessoa: 'fisica',
                cpf: '',
                cnpj: '',
                razaoSocial: '',
                nomeFantasia: '',
                // Etapa 3
                endereco: '',
                numero: '',
                complemento: '',
                bairro: '',
                cidade: '',
                estado: '',
                distribuidora: '',
                numeroInstalacao: '',
                tipoConexao: 'monofasica',
                consumoMedio: '',
                modalidade: 'convencional'
            });

            const [economia, setEconomia] = useState(null);
            const [calculando, setCalculando] = useState(false);

            // Carregar desconto do banco ao iniciar
            useEffect(() => {
                carregarDescontoPercentual();
            }, []);

            const carregarDescontoPercentual = async () => {
                setLoadingDesconto(true);
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/configuracoes?chave=eq.desconto_percentual&select=*`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY
                        }
                    });
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const descontoValor = parseFloat(data[0].valor);
                        setDescontoPercentual(descontoValor);
                        console.log('Desconto carregado do banco:', descontoValor + '%');
                    }
                } catch (error) {
                    console.error('Erro ao carregar desconto:', error);
                    // Mantém o valor padrão de 15%
                } finally {
                    setLoadingDesconto(false);
                }
            };

            const atualizarCampo = (campo, valor) => {
                setFormData(prev => ({...prev, [campo]: valor}));
            };

            const buscarCEP = async (cep) => {
                const cepLimpo = cep.replace(/\D/g, '');
                if (cepLimpo.length === 8) {
                    try {
                        const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                        const data = await response.json();
                        if (!data.erro) {
                            setFormData(prev => ({
                                ...prev,
                                endereco: data.logradouro,
                                bairro: data.bairro,
                                cidade: data.localidade,
                                estado: data.uf
                            }));
                        }
                    } catch (error) {
                        console.error('Erro ao buscar CEP:', error);
                    }
                }
            };

            const calcularEconomia = async () => {
                setCalculando(true);
                try {
                    const consumoMensal = parseFloat(formData.consumoMedio);
                    
                    // Buscar configurações do Supabase
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/configuracoes?select=*`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY
                        }
                    });
                    const configs = await response.json();
                    
                    let tarifaKwh = 0.842355;
                    let proporcaoEnergia = 0.81;
                    let proporcaoImpostos = 0.19;
                    
                    configs.forEach(config => {
                        if (config.chave === 'tarifa_kwh') tarifaKwh = parseFloat(config.valor);
                        if (config.chave === 'proporcao_energia') proporcaoEnergia = parseFloat(config.valor);
                        if (config.chave === 'proporcao_impostos') proporcaoImpostos = parseFloat(config.valor);
                    });

                    // Consumo mínimo baseado na conexão
                    const consumoMinimo = formData.tipoConexao === 'monofasica' ? 30 : 
                                         formData.tipoConexao === 'bifasica' ? 50 : 100;

                    // Cálculos
                    const consumoComMinimo = Math.max(consumoMensal, consumoMinimo);
                    const impostos = consumoComMinimo * tarifaKwh * proporcaoImpostos;
                    const energiaCativa = consumoComMinimo * tarifaKwh * proporcaoEnergia;
                    const contaAtual = impostos + energiaCativa;

                    // Aplicar desconto usando o valor do banco
                    const descontoDecimal = descontoPercentual / 100;
                    const valorDesconto = energiaCativa * descontoDecimal;
                    const energiaComDesconto = energiaCativa - valorDesconto;
                    const contaComOby = impostos + energiaComDesconto;
                    
                    const economiaMensal = contaAtual - contaComOby;
                    const economiaAnual = economiaMensal * 12;

                    setEconomia({
                        consumoMinimo,
                        consumoMensal: consumoComMinimo,
                        impostos,
                        energiaCativa,
                        energiaComDesconto,
                        contaAtual,
                        contaComOby,
                        economiaMensal,
                        economiaAnual,
                        valorDesconto,
                        tipoConexao: formData.tipoConexao
                    });

                    setEtapa(4);
                } catch (error) {
                    console.error('Erro ao calcular:', error);
                    alert('Erro ao calcular economia. Tente novamente.');
                } finally {
                    setCalculando(false);
                }
            };

            const enviarProposta = async () => {
                try {
                    const proposta = {
                        ...formData,
                        economia_mensal: economia?.economiaMensal || 0,
                        economia_anual: economia?.economiaAnual || 0,
                        desconto_aplicado: descontoPercentual,
                        status: 'pendente',
                        created_at: new Date().toISOString()
                    };

                    const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(proposta)
                    });

                    if (response.ok) {
                        setEtapa(5);
                    } else {
                        alert('Erro ao enviar proposta. Tente novamente.');
                    }
                } catch (error) {
                    console.error('Erro ao enviar:', error);
                    alert('Erro ao enviar proposta. Tente novamente.');
                }
            };

            const proximaEtapa = () => {
                if (etapa === 3) {
                    calcularEconomia();
                } else if (etapa === 4) {
                    enviarProposta();
                } else {
                    setEtapa(etapa + 1);
                }
            };

            const etapaAnterior = () => {
                setEtapa(etapa - 1);
            };

            const renderIndicadorProgresso = () => (
                <div className="flex items-center justify-center mb-8">
                    {[1, 2, 3, 4, 5].map((num) => (
                        <React.Fragment key={num}>
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg ${
                                num === etapa ? 'bg-blue-600 text-white' :
                                num < etapa ? 'bg-blue-600 text-white' : 'bg-gray-300 text-gray-600'
                            }`}>
                                {num}
                            </div>
                            {num < 5 && (
                                <div className={`h-1 w-16 mx-2 ${num < etapa ? 'bg-blue-600' : 'bg-gray-300'}`}></div>
                            )}
                        </React.Fragment>
                    ))}
                </div>
            );

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 py-8 px-4">
                    <div className="max-w-4xl mx-auto">
                        {/* Logo */}
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-green-600">⚡ oby energy</h1>
                            <p className="text-xl text-gray-700 mt-2">Energia Renovável com Desconto</p>
                        </div>

                        {renderIndicadorProgresso()}

                        <div className="bg-white rounded-2xl shadow-xl p-8">
                            {/* Etapa 1 */}
                            {etapa === 1 && (
                                <div>
                                    <div className="bg-blue-50 p-4 rounded-lg mb-6">
                                        <p className="text-blue-800 font-semibold text-center">
                                            ⚡ 100% Renovável | Sem obras | Desconto de {descontoPercentual}%
                                        </p>
                                    </div>

                                    <h2 className="text-2xl font-bold mb-6">Dados Pessoais</h2>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-2">CEP *</label>
                                            <input
                                                type="text"
                                                value={formData.cep}
                                                onChange={(e) => {
                                                    atualizarCampo('cep', e.target.value);
                                                    buscarCEP(e.target.value);
                                                }}
                                                placeholder="00000-000"
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                                required
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Nome *</label>
                                                <input
                                                    type="text"
                                                    value={formData.nome}
                                                    onChange={(e) => atualizarCampo('nome', e.target.value)}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Sobrenome *</label>
                                                <input
                                                    type="text"
                                                    value={formData.sobrenome}
                                                    onChange={(e) => atualizarCampo('sobrenome', e.target.value)}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">E-mail *</label>
                                            <input
                                                type="email"
                                                value={formData.email}
                                                onChange={(e) => atualizarCampo('email', e.target.value)}
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                                required
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">Telefone *</label>
                                            <input
                                                type="tel"
                                                value={formData.telefone}
                                                onChange={(e) => atualizarCampo('telefone', e.target.value)}
                                                placeholder="(00) 00000-0000"
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <button
                                        onClick={proximaEtapa}
                                        className="w-full mt-6 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700"
                                    >
                                        Continuar →
                                    </button>
                                </div>
                            )}

                            {/* Etapa 2 */}
                            {etapa === 2 && (
                                <div>
                                    <h2 className="text-2xl font-bold mb-6">Tipo de Pessoa</h2>

                                    <div className="flex gap-4 mb-6">
                                        <button
                                            onClick={() => atualizarCampo('tipoPessoa', 'fisica')}
                                            className={`flex-1 p-4 rounded-lg border-2 ${
                                                formData.tipoPessoa === 'fisica'
                                                    ? 'border-blue-600 bg-blue-50'
                                                    : 'border-gray-300'
                                            }`}
                                        >
                                            <p className="font-semibold">Pessoa Física</p>
                                        </button>
                                        <button
                                            onClick={() => atualizarCampo('tipoPessoa', 'juridica')}
                                            className={`flex-1 p-4 rounded-lg border-2 ${
                                                formData.tipoPessoa === 'juridica'
                                                    ? 'border-blue-600 bg-blue-50'
                                                    : 'border-gray-300'
                                            }`}
                                        >
                                            <p className="font-semibold">Pessoa Jurídica</p>
                                        </button>
                                    </div>

                                    <div className="space-y-4">
                                        {formData.tipoPessoa === 'fisica' ? (
                                            <div>
                                                <label className="block text-sm font-medium mb-2">CPF *</label>
                                                <input
                                                    type="text"
                                                    value={formData.cpf}
                                                    onChange={(e) => atualizarCampo('cpf', e.target.value)}
                                                    placeholder="000.000.000-00"
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    required
                                                />
                                            </div>
                                        ) : (
                                            <>
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">CNPJ *</label>
                                                    <input
                                                        type="text"
                                                        value={formData.cnpj}
                                                        onChange={(e) => atualizarCampo('cnpj', e.target.value)}
                                                        placeholder="00.000.000/0000-00"
                                                        className="w-full p-3 border border-gray-300 rounded-lg"
                                                        required
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">Razão Social *</label>
                                                    <input
                                                        type="text"
                                                        value={formData.razaoSocial}
                                                        onChange={(e) => atualizarCampo('razaoSocial', e.target.value)}
                                                        className="w-full p-3 border border-gray-300 rounded-lg"
                                                        required
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">Nome Fantasia</label>
                                                    <input
                                                        type="text"
                                                        value={formData.nomeFantasia}
                                                        onChange={(e) => atualizarCampo('nomeFantasia', e.target.value)}
                                                        className="w-full p-3 border border-gray-300 rounded-lg"
                                                    />
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    <div className="flex gap-4 mt-6">
                                        <button
                                            onClick={etapaAnterior}
                                            className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-400"
                                        >
                                            ← Voltar
                                        </button>
                                        <button
                                            onClick={proximaEtapa}
                                            className="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700"
                                        >
                                            Continuar →
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Etapa 3 */}
                            {etapa === 3 && (
                                <div>
                                    <h2 className="text-2xl font-bold mb-6">Dados da Instalação</h2>

                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-medium mb-2">Endereço *</label>
                                                <input
                                                    type="text"
                                                    value={formData.endereco}
                                                    onChange={(e) => atualizarCampo('endereco', e.target.value)}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Número *</label>
                                                <input
                                                    type="text"
                                                    value={formData.numero}
                                                    onChange={(e) => atualizarCampo('numero', e.target.value)}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">Complemento</label>
                                            <input
                                                type="text"
                                                value={formData.complemento}
                                                onChange={(e) => atualizarCampo('complemento', e.target.value)}
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Bairro *</label>
                                                <input
                                                    type="text"
                                                    value={formData.bairro}
                                                    onChange={(e) => atualizarCampo('bairro', e.target.value)}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Cidade *</label>
                                                <input
                                                    type="text"
                                                    value={formData.cidade}
                                                    onChange={(e) => atualizarCampo('cidade', e.target.value)}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Estado *</label>
                                                <input
                                                    type="text"
                                                    value={formData.estado}
                                                    onChange={(e) => atualizarCampo('estado', e.target.value)}
                                                    className="w-full p-3 border border-gray-300 rounded-lg"
                                                    maxLength="2"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">Distribuidora *</label>
                                            <input
                                                type="text"
                                                value={formData.distribuidora}
                                                onChange={(e) => atualizarCampo('distribuidora', e.target.value)}
                                                placeholder="Ex: CPFL, Enel, Light..."
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                                required
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">Número da Instalação *</label>
                                            <input
                                                type="text"
                                                value={formData.numeroInstalacao}
                                                onChange={(e) => atualizarCampo('numeroInstalacao', e.target.value)}
                                                placeholder="Número da unidade consumidora"
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                                required
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">Tipo de Conexão *</label>
                                            <select
                                                value={formData.tipoConexao}
                                                onChange={(e) => atualizarCampo('tipoConexao', e.target.value)}
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            >
                                                <option value="monofasica">Monofásica</option>
                                                <option value="bifasica">Bifásica</option>
                                                <option value="trifasica">Trifásica</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">Consumo Médio Mensal (kWh) *</label>
                                            <input
                                                type="number"
                                                value={formData.consumoMedio}
                                                onChange={(e) => atualizarCampo('consumoMedio', e.target.value)}
                                                placeholder="Ex: 350"
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                                required
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-2">Modalidade Tarifária *</label>
                                            <select
                                                value={formData.modalidade}
                                                onChange={(e) => atualizarCampo('modalidade', e.target.value)}
                                                className="w-full p-3 border border-gray-300 rounded-lg"
                                            >
                                                <option value="convencional">Convencional</option>
                                                <option value="branca">Tarifa Branca</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="flex gap-4 mt-6">
                                        <button
                                            onClick={etapaAnterior}
                                            className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-400"
                                        >
                                            ← Voltar
                                        </button>
                                        <button
                                            onClick={proximaEtapa}
                                            disabled={calculando}
                                            className="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 disabled:opacity-50"
                                        >
                                            {calculando ? 'Calculando...' : 'Calcular Economia →'}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Etapa 4 - Resumo da Economia */}
                            {etapa === 4 && economia && (
                                <div>
                                    <div className="bg-gradient-to-r from-green-400 to-blue-500 rounded-xl p-6 text-white text-center mb-6">
                                        <p className="text-lg mb-2">Sua Economia Mensal com Energia</p>
                                        <p className="text-5xl font-bold">R$ {economia.economiaMensal.toFixed(2)}</p>
                                        <p className="text-sm mt-2">Desconto de até {descontoPercentual}% *</p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                        {/* Conta Atual */}
                                        <div className="border-2 border-red-200 rounded-lg p-4">
                                            <h3 className="font-bold text-center mb-4 text-red-700">Conta Atual</h3>
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between">
                                                    <span>Consumo Mínimo</span>
                                                    <span>R$ {economia.consumoMinimo.toFixed(2)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Impostos Não Compensáveis</span>
                                                    <span>R$ {economia.impostos.toFixed(2)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Energia Cativa</span>
                                                    <span>R$ {economia.energiaCativa.toFixed(2)}</span>
                                                </div>
                                                <div className="border-t-2 border-red-300 pt-2 flex justify-between font-bold">
                                                    <span>Total</span>
                                                    <span className="text-red-700">R$ {economia.contaAtual.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Conta Com Oby */}
                                        <div className="border-2 border-green-200 rounded-lg p-4">
                                            <h3 className="font-bold text-center mb-4 text-green-700">Com a Oby</h3>
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between">
                                                    <span>Consumo Mínimo</span>
                                                    <span>R$ {economia.consumoMinimo.toFixed(2)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Impostos Não Compensáveis</span>
                                                    <span>R$ {economia.impostos.toFixed(2)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Energia Cativa</span>
                                                    <span>R$ {economia.energiaComDesconto.toFixed(2)}</span>
                                                </div>
                                                <div className="border-t-2 border-green-300 pt-2 flex justify-between font-bold">
                                                    <span>Total</span>
                                                    <span className="text-green-700">R$ {economia.contaComOby.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Seu desconto conosco */}
                                    <div className="bg-blue-50 rounded-lg p-4 mb-6">
                                        <h3 className="font-bold text-center mb-3 text-blue-800">Seu desconto conosco:</h3>
                                        <div className="space-y-2 text-sm">
                                            <div className="flex justify-between">
                                                <span>Consumo Mínimo</span>
                                                <span>R$ {economia.consumoMinimo.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Impostos Não Compensáveis</span>
                                                <span>R$ {economia.impostos.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Energia Cativa</span>
                                                <span>R$ {economia.energiaCativa.toFixed(2)}</span>
                                            </div>
                                            <div className="border-t-2 border-blue-300 pt-2 flex justify-between">
                                                <span>R$ {economia.contaAtual.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between font-bold text-green-700">
                                                <span>Desconto Oby na Energia (-{descontoPercentual}%)</span>
                                                <span>(R$ {economia.valorDesconto.toFixed(2)})</span>
                                            </div>
                                            <div className="border-t-2 border-green-500 pt-2 flex justify-between font-bold text-green-700 text-lg">
                                                <span>R$ {economia.contaComOby.toFixed(2)}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Resumo */}
                                    <div className="bg-green-50 rounded-lg p-4 mb-6">
                                        <p className="text-center font-semibold text-green-800 mb-4">
                                            Sua economia equivale a pagar somente<br/>
                                            <span className="text-2xl">{(economia.contaComOby / economia.contaAtual * 12).toFixed(2)} contas ao ano</span>
                                        </p>
                                    </div>

                                    {/* Dados da Entrada */}
                                    <div className="border rounded-lg p-4 mb-6">
                                        <h3 className="font-bold mb-4">📊 Dados de Entrada do Cadastro</h3>
                                        
                                        <div className="mb-4">
                                            <p className="font-semibold mb-2">Base do Consumo Mínimo:</p>
                                            <div className="bg-gray-50 p-3 rounded">
                                                <div className="grid grid-cols-2 gap-2 text-sm">
                                                    <div className="flex justify-between">
                                                        <span>Conexão</span>
                                                        <span className="font-medium">{economia.tipoConexao}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>Consumo Mínimo kWh</span>
                                                        <span className="font-medium">{economia.consumoMinimo}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-blue-50 p-3 rounded">
                                            <p className="font-semibold mb-2">Consumo Médio Mensal:</p>
                                            <p className="text-2xl font-bold text-blue-700">{economia.consumoMensal} kWh</p>
                                        </div>
                                    </div>

                                    {/* Resumo da Economia */}
                                    <div className="bg-gradient-to-br from-green-100 to-blue-100 rounded-lg p-4 mb-6">
                                        <h3 className="font-bold mb-3 flex items-center">
                                            <span className="text-xl mr-2">📊</span>
                                            Resumo da Economia
                                        </h3>
                                        <div className="space-y-2">
                                            <div className="flex justify-between">
                                                <span>Economia Mensal:</span>
                                                <span className="font-bold text-green-600">R$ {economia.economiaMensal.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Economia Anual:</span>
                                                <span className="font-bold text-green-600">R$ {economia.economiaAnual.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Tipo de Conexão:</span>
                                                <span className="font-bold">{economia.tipoConexao}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Desconto Aplicado:</span>
                                                <span className="font-bold text-blue-600">{descontoPercentual}%</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-4">
                                        <button
                                            onClick={etapaAnterior}
                                            className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-400"
                                        >
                                            ← Voltar
                                        </button>
                                        <button
                                            onClick={proximaEtapa}
                                            className="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700"
                                        >
                                            Confirmar Proposta →
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Etapa 5 - Confirmação */}
                            {etapa === 5 && (
                                <div className="text-center py-8">
                                    <div className="text-6xl mb-4">✅</div>
                                    <h2 className="text-3xl font-bold text-green-600 mb-4">Proposta Enviada!</h2>
                                    <p className="text-gray-700 mb-6">
                                        Recebemos sua proposta e entraremos em contato em breve.
                                    </p>
                                    <p className="text-sm text-gray-600">
                                        Você receberá um e-mail de confirmação em {formData.email}
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FormularioEnergia />, document.getElementById('root'));
    </script>
</body>
</html>

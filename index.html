<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBY Energy - Contratação</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';
        const formatBRL = (valor) => {
            const num = parseFloat(valor);
            if (isNaN(num)) return '0,00';
            return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };


        function EnergyContractForm() {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [mostrarMinuta, setMostrarMinuta] = useState(false);
            const [mostrarRevisao, setMostrarRevisao] = useState(false);
            const [propostaId, setPropostaId] = useState(null);
            const [formData, setFormData] = useState({
                cep: '', nome: '', sobrenome: '', cupom: '', 
                email: '', telefone: '', valorMedioConta: '',
                logradouro: '', numeroEndereco: '', complemento: '', bairro: '',
                estado: '', cidade: '',
                modalidadeTarifaria: '', distribuidoraEnergia: 'COPEL',
                logradouroInstalacao: '', numeroInstalacaoEndereco: '',
                complementoInstalacao: '', bairroInstalacao: '',
                cidadeInstalacao: '', estadoInstalacao: '',
                arquivoConta: null, tipoConexao: '', consumoKW: '', 
                numeroInstalacao: '', numeroCliente: '',
                tipoPessoa: 'fisica', cpf: '', rg: '', 
                arquivoRGFrente: null, arquivoRGVerso: null,
                cnpj: '', nomeFantasia: '', razaoSocial: '',
                representanteLegal1: '', cpfRepresentante1: '', rgRepresentante1: '', 
                arquivoRGRep1Frente: null, arquivoRGRep1Verso: null,
                representanteLegal2: '', cpfRepresentante2: '', rgRepresentante2: '', 
                arquivoRGRep2Frente: null, arquivoRGRep2Verso: null,
                copiarDadosContato: false,
                tipoDocumentoEmpresa: 'contrato', contratoSocial: null,
                temResponsavelPagamento: false,
                nomeResponsavelPagamento: '', cpfResponsavelPagamento: '',
                rgResponsavelPagamento: '',
                arquivoRGRespPagFrente: null, arquivoRGRespPagVerso: null,
                aceiteTermoAdesao: false, aceiteDadosPessoais: false
            });
            const [errors, setErrors] = useState({});
            const [simulacao, setSimulacao] = useState(null);
            const [cepValidado, setCepValidado] = useState(false);
            const [estadoForaCobertura, setEstadoForaCobertura] = useState(false);

            const consumoMinimo = { trifasico: 100, bifasico: 50, monofasico: 30 };

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
                if (errors[name]) setErrors(prev => ({ ...prev, [name]: '' }));
            };

            const handleFileChange = (e) => {
                const { name, files } = e.target;
                if (files && files[0]) {
                    setFormData(prev => ({ ...prev, [name]: files[0] }));
                    if (errors[name]) setErrors(prev => ({ ...prev, [name]: '' }));
                }
            };

            const validateCEP = async () => {
                const cepRegex = /^\d{5}-?\d{3}$/;
                if (!cepRegex.test(formData.cep)) {
                    setErrors(prev => ({ ...prev, cep: 'CEP inválido' }));
                    return false;
                }
                
                try {
                    const cepLimpo = formData.cep.replace('-', '');
                    const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const data = await response.json();
                    
                    if (data.erro) {
                        setErrors(prev => ({ ...prev, cep: 'CEP não encontrado' }));
                        return false;
                    }
                    
                    setFormData(prev => ({ 
                        ...prev, 
                        estado: data.uf, 
                        cidade: data.localidade,
                        logradouro: data.logradouro || '',
                        bairro: data.bairro || '',
                    }));
                    
                    if (data.uf !== 'PR') {
                        setEstadoForaCobertura(true);
                    } else {
                        setEstadoForaCobertura(false);
                    }
                    
                    setCepValidado(true);
                    return true;
                } catch (error) {
                    setErrors(prev => ({ ...prev, cep: 'Erro ao validar CEP' }));
                    return false;
                }
            };

            const validateStep = () => {
                const newErrors = {};
                
                if (step === 1) {
                    if (!formData.cep) newErrors.cep = 'Campo obrigatório';
                    if (!formData.nome) newErrors.nome = 'Campo obrigatório';
                    if (!formData.sobrenome) newErrors.sobrenome = 'Campo obrigatório';
                    if (!formData.email) newErrors.email = 'Campo obrigatório';
                    if (!formData.telefone) newErrors.telefone = 'Campo obrigatório';
                    if (!cepValidado) newErrors.cep = 'Valide o CEP antes de continuar';
                }
                
                if (step === 2) {
                    if (!formData.logradouro) newErrors.logradouro = 'Campo obrigatório';
                    if (!formData.numeroEndereco) newErrors.numeroEndereco = 'Campo obrigatório';
                    if (!formData.bairro) newErrors.bairro = 'Campo obrigatório';
                }
                
                if (step === 3) {
                    if (!formData.modalidadeTarifaria) newErrors.modalidadeTarifaria = 'Campo obrigatório';
                    if (!formData.distribuidoraEnergia) newErrors.distribuidoraEnergia = 'Campo obrigatório';
                    if (!formData.tipoConexao) newErrors.tipoConexao = 'Campo obrigatório';
                    if (!formData.consumoKW) newErrors.consumoKW = 'Campo obrigatório';
                    if (!formData.numeroInstalacao) newErrors.numeroInstalacao = 'Campo obrigatório';
                    
                    const consumo = parseFloat(formData.consumoKW);
                    const minimo = consumoMinimo[formData.tipoConexao];
                    if (consumo < minimo) {
                        newErrors.consumoKW = `Consumo mínimo para ${formData.tipoConexao}: ${minimo} kW`;
                    }
                }
                
                if (step === 5) {
                    if (formData.tipoPessoa === 'fisica') {
                        if (!formData.cpf) newErrors.cpf = 'Campo obrigatório';
                        if (!formData.rg) newErrors.rg = 'Campo obrigatório';
                        if (!formData.arquivoRGFrente) newErrors.arquivoRGFrente = 'Campo obrigatório';
                        if (!formData.arquivoRGVerso) newErrors.arquivoRGVerso = 'Campo obrigatório';
                    } else {
                        if (!formData.cnpj) newErrors.cnpj = 'Campo obrigatório';
                        if (!formData.nomeFantasia) newErrors.nomeFantasia = 'Campo obrigatório';
                        if (!formData.razaoSocial) newErrors.razaoSocial = 'Campo obrigatório';
                        if (!formData.representanteLegal1) newErrors.representanteLegal1 = 'Campo obrigatório';
                        if (!formData.cpfRepresentante1) newErrors.cpfRepresentante1 = 'Campo obrigatório';
                        if (!formData.rgRepresentante1) newErrors.rgRepresentante1 = 'Campo obrigatório';
                        if (!formData.arquivoRGRep1Frente) newErrors.arquivoRGRep1Frente = 'Campo obrigatório';
                        if (!formData.arquivoRGRep1Verso) newErrors.arquivoRGRep1Verso = 'Campo obrigatório';
                        if (!formData.contratoSocial) newErrors.contratoSocial = 'Campo obrigatório';
                    }
                    
                    if (formData.temResponsavelPagamento) {
                        if (!formData.nomeResponsavelPagamento) newErrors.nomeResponsavelPagamento = 'Campo obrigatório';
                        if (!formData.cpfResponsavelPagamento) newErrors.cpfResponsavelPagamento = 'Campo obrigatório';
                        if (!formData.rgResponsavelPagamento) newErrors.rgResponsavelPagamento = 'Campo obrigatório';
                        if (!formData.arquivoRGRespPagFrente) newErrors.arquivoRGRespPagFrente = 'Campo obrigatório';
                        if (!formData.arquivoRGRespPagVerso) newErrors.arquivoRGRespPagVerso = 'Campo obrigatório';
                    }
                    
                    if (!formData.arquivoConta) newErrors.arquivoConta = 'Campo obrigatório';
                    if (!formData.aceiteTermoAdesao) newErrors.aceiteTermoAdesao = 'Você deve aceitar este termo';
                    if (!formData.aceiteDadosPessoais) newErrors.aceiteDadosPessoais = 'Você deve aceitar este termo';
                }
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const calcularSimulacao = async () => {
                try {
                    console.log('Iniciando cálculo da simulação...');
                    console.log('Consumo KW:', formData.consumoKW);
                    console.log('Tipo Conexão:', formData.tipoConexao);
                    
                    const configResponse = await fetch(`${SUPABASE_URL}/rest/v1/configuracoes?select=*`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    
                    if (!configResponse.ok) {
                        console.error('Erro ao buscar configurações');
                        return;
                    }
                    
                    const configs = await configResponse.json();
                    console.log('Configurações:', configs);
                    
                    if (!configs || configs.length === 0) {
                        console.error('Nenhuma configuração encontrada');
                        return;
                    }
                    
                    const config = configs[0];
                    
                    const tarifaKwh = config.tarifa_kwh;
                    const proporcaoEnergia = config.proporcao_energia;
                    const proporcaoImpostos = config.proporcao_impostos;
                    const desconto = formData.cupom ? 0.20 : 0.15;
                    
                    const consumo = parseFloat(formData.consumoKW);
                    const consumoMinimoKW = consumoMinimo[formData.tipoConexao];
                    
                    console.log('Tarifa kWh:', tarifaKwh);
                    console.log('Consumo:', consumo);
                    console.log('Consumo Mínimo KW:', consumoMinimoKW);
                    
                    const consumoMinimoValor = consumoMinimoKW * tarifaKwh;
                    const valorTotal = consumo * tarifaKwh;
                    const valorEnergia = valorTotal * proporcaoEnergia;
                    const valorImpostos = valorTotal * proporcaoImpostos;
                    
                    const energiaCativaAtual = valorEnergia;
                    const energiaCativaComDesconto = valorEnergia * (1 - desconto);
                    const economiaMensal = energiaCativaAtual - energiaCativaComDesconto;
                    
                    const contaAtual = consumoMinimoValor + valorImpostos + energiaCativaAtual;
                    const contaNova = consumoMinimoValor + valorImpostos + energiaCativaComDesconto;
                    
                    const economiaAnual = economiaMensal * 12;
                    const contasPorAno = (12 - (economiaAnual / contaAtual)).toFixed(2);
                    
                    const simulacaoCalculada = {
                        desconto: (desconto * 100),
                        consumoMinimoValor,
                        impostosNaoCompensaveis: valorImpostos,
                        energiaCativaAtual,
                        energiaCativaComDesconto,
                        contaAtual,
                        contaNova,
                        economiaMensal,
                        economiaAnual,
                        contasPorAno,
                        consumoKW: consumo,
                        consumoMinimoKW,
                        tipoConexao: formData.tipoConexao
                    };
                    
                    console.log('Simulação calculada:', simulacaoCalculada);
                    setSimulacao(simulacaoCalculada);
                } catch (error) {
                    console.error('Erro ao calcular simulação:', error);
                    alert('Erro ao calcular a simulação. Por favor, tente novamente.');
                }
            };

            const handleNext = async () => {
                if (!validateStep()) return;
                
                if (step === 3) {
                    setLoading(true);
                    await calcularSimulacao();
                    setLoading(false);
                }
                
                if (step === 5) {
                    await handleSubmit();
                    return;
                }
                
                setStep(step + 1);
            };

            const uploadFile = async (file, folder) => {
                const fileName = `${Date.now()}_${file.name}`;
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(
                    `${SUPABASE_URL}/storage/v1/object/${folder}/${fileName}`,
                    {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        },
                        body: file
                    }
                );
                
                if (!response.ok) throw new Error('Erro no upload');
                
                return `${SUPABASE_URL}/storage/v1/object/public/${folder}/${fileName}`;
            };

            const handleSubmit = async () => {
                setLoading(true);
                try {
                    const arquivoContaUrl = formData.arquivoConta ? await uploadFile(formData.arquivoConta, 'contas-energia') : null;
                    const arquivoRGFrenteUrl = formData.arquivoRGFrente ? await uploadFile(formData.arquivoRGFrente, 'documentos') : null;
                    const arquivoRGVersoUrl = formData.arquivoRGVerso ? await uploadFile(formData.arquivoRGVerso, 'documentos') : null;
                    const arquivoRGRep1FrenteUrl = formData.arquivoRGRep1Frente ? await uploadFile(formData.arquivoRGRep1Frente, 'documentos') : null;
                    const arquivoRGRep1VersoUrl = formData.arquivoRGRep1Verso ? await uploadFile(formData.arquivoRGRep1Verso, 'documentos') : null;
                    const arquivoRGRespPagFrenteUrl = formData.arquivoRGRespPagFrente ? await uploadFile(formData.arquivoRGRespPagFrente, 'documentos') : null;
                    const arquivoRGRespPagVersoUrl = formData.arquivoRGRespPagVerso ? await uploadFile(formData.arquivoRGRespPagVerso, 'documentos') : null;
                    const contratoSocialUrl = formData.contratoSocial ? await uploadFile(formData.contratoSocial, 'documentos') : null;
                    
                    const proposta = {
                        nome_completo: `${formData.nome} ${formData.sobrenome}`,
                        email: formData.email,
                        telefone: formData.telefone,
                        cep: formData.cep,
                        logradouro: formData.logradouro,
                        numero_endereco: formData.numeroEndereco,
                        complemento: formData.complemento,
                        bairro: formData.bairro,
                        cidade: formData.cidade,
                        estado: formData.estado,
                        modalidade_tarifaria: formData.modalidadeTarifaria,
                        distribuidora_energia: formData.distribuidoraEnergia,
                        tipo_conexao: formData.tipoConexao,
                        consumo_kw: parseFloat(formData.consumoKW),
                        numero_instalacao: formData.numeroInstalacao,
                        tipo_pessoa: formData.tipoPessoa,
                        cpf: formData.cpf,
                        rg: formData.rg,
                        cnpj: formData.cnpj,
                        nome_fantasia: formData.nomeFantasia,
                        razao_social: formData.razaoSocial,
                        representante_legal_1: formData.representanteLegal1,
                        cpf_representante_1: formData.cpfRepresentante1,
                        rg_representante_1: formData.rgRepresentante1,
                        tem_responsavel_pagamento: formData.temResponsavelPagamento,
                        nome_responsavel_pagamento: formData.nomeResponsavelPagamento,
                        cpf_responsavel_pagamento: formData.cpfResponsavelPagamento,
                        rg_responsavel_pagamento: formData.rgResponsavelPagamento,
                        arquivo_conta_url: arquivoContaUrl,
                        arquivo_rg_frente_url: arquivoRGFrenteUrl,
                        arquivo_rg_verso_url: arquivoRGVersoUrl,
                        arquivo_rg_rep1_frente_url: arquivoRGRep1FrenteUrl,
                        arquivo_rg_rep1_verso_url: arquivoRGRep1VersoUrl,
                        arquivo_rg_resp_pag_frente_url: arquivoRGRespPagFrenteUrl,
                        arquivo_rg_resp_pag_verso_url: arquivoRGRespPagVersoUrl,
                        contrato_social_url: contratoSocialUrl,
                        simulacao_economia_mensal: simulacao.economiaMensal,
                        simulacao_economia_anual: simulacao.economiaAnual,
                        simulacao_conta_atual: simulacao.contaAtual,
                        simulacao_conta_nova: simulacao.contaNova,
                        desconto_aplicado: simulacao.desconto,
                        cupom_desconto: formData.cupom,
                        aceite_termo_adesao: formData.aceiteTermoAdesao,
                        aceite_dados_pessoais: formData.aceiteDadosPessoais,
                        status: 'pendente'
                    };
                    
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(proposta)
                    });
                    
                    if (!response.ok) throw new Error('Erro ao salvar proposta');
                    
                    const result = await response.json();
                    setPropostaId(result[0].id);
                    setMostrarRevisao(true);
                } catch (error) {
                    console.error('Erro:', error);
                    alert('Erro ao enviar proposta. Tente novamente.');
                } finally {
                    setLoading(false);
                }
            };

            if (mostrarRevisao) {
                const dataAtual = new Date().toLocaleDateString('pt-BR');
                
                return (
                    <div className="min-h-screen bg-white p-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="text-center mb-8">
                                <img src="https://uuaqmwnfjopgjmjjchmw.supabase.co/storage/v1/object/public/logos/Logo%20Oby%20-%20Baixa%20Qualidade.png" alt="OBY Energy" className="h-24 w-auto mx-auto mb-4" />
                                <h1 className="text-3xl font-bold text-green-600">✅ Proposta Enviada com Sucesso!</h1>
                                <p className="text-gray-600 mt-2">Sua proposta foi registrada e será analisada em breve.</p>
                            </div>

                            <div className="bg-gradient-to-r from-green-100 to-blue-100 p-8 rounded-xl mb-8">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                                    <div>
                                        <p className="text-sm text-gray-600 mb-2">Economia Mensal</p>
                                        <p className="text-3xl font-bold text-green-600">R$ {formatBRL(simulacao.economiaMensal)}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-gray-600 mb-2">Economia Anual</p>
                                        <p className="text-3xl font-bold text-blue-600">R$ {formatBRL(simulacao.economiaAnual)}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm text-gray-600 mb-2">Desconto</p>
                                        <p className="text-3xl font-bold text-purple-600">{simulacao.desconto}%</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white border-2 border-gray-200 rounded-xl p-6 mb-6">
                                <h2 className="text-2xl font-bold mb-6 text-center border-b pb-4">Resumo da Proposta</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <h3 className="font-bold text-lg mb-3 text-blue-600">Dados Pessoais</h3>
                                        <div className="space-y-2 text-sm">
                                            <p><strong>Nome:</strong> {formData.nome} {formData.sobrenome}</p>
                                            <p><strong>Email:</strong> {formData.email}</p>
                                            <p><strong>Telefone:</strong> {formData.telefone}</p>
                                            <p><strong>Tipo:</strong> {formData.tipoPessoa === 'fisica' ? 'Pessoa Física' : 'Pessoa Jurídica'}</p>
                                            {formData.tipoPessoa === 'fisica' ? (
                                                <p><strong>CPF:</strong> {formData.cpf}</p>
                                            ) : (
                                                <p><strong>CNPJ:</strong> {formData.cnpj}</p>
                                            )}
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <h3 className="font-bold text-lg mb-3 text-green-600">Dados da Instalação</h3>
                                        <div className="space-y-2 text-sm">
                                            <p><strong>Tipo de Conexão:</strong> {formData.tipoConexao}</p>
                                            <p><strong>Consumo:</strong> {formData.consumoKW} kW</p>
                                            <p><strong>Nº Instalação:</strong> {formData.numeroInstalacao}</p>
                                            <p><strong>Modalidade:</strong> {formData.modalidadeTarifaria}</p>
                                            <p><strong>Distribuidora:</strong> {formData.distribuidoraEnergia}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-6 pt-6 border-t">
                                    <h3 className="font-bold text-lg mb-3 text-purple-600">Endereço</h3>
                                    <p className="text-sm">{formData.logradouro}, {formData.numeroEndereco} {formData.complemento && `- ${formData.complemento}`}</p>
                                    <p className="text-sm">{formData.bairro} - {formData.cidade}/{formData.estado}</p>
                                    <p className="text-sm">CEP: {formData.cep}</p>
                                </div>

                                <div className="mt-6 pt-6 border-t">
                                    <div className="bg-green-50 p-6 rounded-lg text-center">
                                        <p className="text-lg font-bold text-green-800 mb-2">🎉 Parabéns pela escolha sustentável!</p>
                                        <p className="text-gray-600 text-xs mt-1">Comece a economizar na sua conta de luz</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="mt-8 flex gap-4 justify-center no-print">
                                <button onClick={() => window.print()} className="px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">
                                    🖨️ Imprimir Proposta
                                </button>
                                <button onClick={() => window.location.reload()} className="px-6 py-3 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition">
                                    ➕ Nova Proposta
                                </button>
                            </div>

                            <div className="mt-6 text-center text-xs text-gray-500">
                                <p>Data: {dataAtual} | ID da Proposta: {propostaId}</p>
                                <p className="mt-2">Dúvidas? Entre em contato: contato@obyenergy.com</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-green-50 p-4">
                    <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
                        <div className="text-center mb-8">
                            <div className="flex justify-center mb-4">
                                <img src="https://uuaqmwnfjopgjmjjchmw.supabase.co/storage/v1/object/public/logos/Logo%20Oby%20-%20Baixa%20Qualidade.png" alt="OBY Energy" className="h-20 w-auto" />
                            </div>
                            <h2 className="text-xl text-gray-600">Energia Renovável com Desconto</h2>
                        </div>

                        <div className="flex justify-between items-center mb-8">
                            {[1, 2, 3, 4, 5].map((s) => (

                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium mb-2">RG/CNH Frente *</label>
                                                <input type="file" name="arquivoRGFrente" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGFrente ? 'border-red-500' : 'border-gray-300'}`} />
                                                {formData.arquivoRGFrente && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGFrente.name}</p>}
                                                {errors.arquivoRGFrente && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGFrente}</p>}
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-2">RG/CNH Verso *</label>
                                                <input type="file" name="arquivoRGVerso" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGVerso ? 'border-red-500' : 'border-gray-300'}`} />
                                                {formData.arquivoRGVerso && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGVerso.name}</p>}
                                                {errors.arquivoRGVerso && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGVerso}</p>}
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">CNPJ *</label>
                                            <input type="text" name="cnpj" value={formData.cnpj} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.cnpj ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.cnpj && <p className="text-red-500 text-sm mt-1">{errors.cnpj}</p>}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Nome Fantasia *</label>
                                            <input type="text" name="nomeFantasia" value={formData.nomeFantasia} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.nomeFantasia ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.nomeFantasia && <p className="text-red-500 text-sm mt-1">{errors.nomeFantasia}</p>}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Razão Social *</label>
                                            <input type="text" name="razaoSocial" value={formData.razaoSocial} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.razaoSocial ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.razaoSocial && <p className="text-red-500 text-sm mt-1">{errors.razaoSocial}</p>}
                                        </div>
                                        <div className="border-t pt-4">
                                            <h3 className="font-bold mb-4">Representante Legal 1 *</h3>
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">Nome Completo *</label>
                                                    <input type="text" name="representanteLegal1" value={formData.representanteLegal1} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.representanteLegal1 ? 'border-red-500' : 'border-gray-300'}`} />
                                                    {errors.representanteLegal1 && <p className="text-red-500 text-sm mt-1">{errors.representanteLegal1}</p>}
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">CPF *</label>
                                                        <input type="text" name="cpfRepresentante1" value={formData.cpfRepresentante1} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.cpfRepresentante1 ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {errors.cpfRepresentante1 && <p className="text-red-500 text-sm mt-1">{errors.cpfRepresentante1}</p>}
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">RG *</label>
                                                        <input type="text" name="rgRepresentante1" value={formData.rgRepresentante1} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.rgRepresentante1 ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {errors.rgRepresentante1 && <p className="text-red-500 text-sm mt-1">{errors.rgRepresentante1}</p>}
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">RG/CPF Frente *</label>
                                                        <input type="file" name="arquivoRGRep1Frente" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGRep1Frente ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {formData.arquivoRGRep1Frente && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRep1Frente.name}</p>}
                                                        {errors.arquivoRGRep1Frente && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRep1Frente}</p>}
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">RG/CPF Verso *</label>
                                                        <input type="file" name="arquivoRGRep1Verso" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGRep1Verso ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {formData.arquivoRGRep1Verso && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRep1Verso.name}</p>}
                                                        {errors.arquivoRGRep1Verso && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRep1Verso}</p>}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Contrato Social ou Ata de Eleição *</label>
                                            <input type="file" name="contratoSocial" onChange={handleFileChange} accept=".pdf" className={`w-full p-3 border rounded-lg ${errors.contratoSocial ? 'border-red-500' : 'border-gray-300'}`} />
                                            {formData.contratoSocial && <p className="text-green-600 text-sm mt-1">✓ {formData.contratoSocial.name}</p>}
                                            {errors.contratoSocial && <p className="text-red-500 text-sm mt-1">{errors.contratoSocial}</p>}
                                        </div>
                                    </>
                                )}

                                <div className="border-t pt-6 mt-6">
                                    <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-400 mb-4">
                                        <label className="flex items-center cursor-pointer">
                                            <input type="checkbox" name="temResponsavelPagamento" checked={formData.temResponsavelPagamento} onChange={handleInputChange} className="mr-3 w-5 h-5" />
                                            <span className="text-sm font-medium">Adicionar Responsável pelo Pagamento Futuro</span>
                                        </label>
                                    </div>

                                    {formData.temResponsavelPagamento && (
                                        <div className="space-y-4 bg-gray-50 p-4 rounded-lg">
                                            <h3 className="font-bold text-lg mb-4">Dados do Responsável pelo Pagamento</h3>
                                            <div>
                                                <label className="block text-sm font-medium mb-2">Nome Completo *</label>
                                                <input type="text" name="nomeResponsavelPagamento" value={formData.nomeResponsavelPagamento} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.nomeResponsavelPagamento ? 'border-red-500' : 'border-gray-300'}`} />
                                                {errors.nomeResponsavelPagamento && <p className="text-red-500 text-sm mt-1">{errors.nomeResponsavelPagamento}</p>}
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">CPF *</label>
                                                    <input type="text" name="cpfResponsavelPagamento" value={formData.cpfResponsavelPagamento} onChange={handleInputChange} placeholder="000.000.000-00" className={`w-full p-3 border rounded-lg ${errors.cpfResponsavelPagamento ? 'border-red-500' : 'border-gray-300'}`} />
                                                    {errors.cpfResponsavelPagamento && <p className="text-red-500 text-sm mt-1">{errors.cpfResponsavelPagamento}</p>}
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">RG *</label>
                                                    <input type="text" name="rgResponsavelPagamento" value={formData.rgResponsavelPagamento} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.rgResponsavelPagamento ? 'border-red-500' : 'border-gray-300'}`} />
                                                    {errors.rgResponsavelPagamento && <p className="text-red-500 text-sm mt-1">{errors.rgResponsavelPagamento}</p>}
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">RG/CNH Frente *</label>
                                                    <input type="file" name="arquivoRGRespPagFrente" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGRespPagFrente ? 'border-red-500' : 'border-gray-300'}`} />
                                                    {formData.arquivoRGRespPagFrente && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRespPagFrente.name}</p>}
                                                    {errors.arquivoRGRespPagFrente && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRespPagFrente}</p>}
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">RG/CNH Verso *</label>
                                                    <input type="file" name="arquivoRGRespPagVerso" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGRespPagVerso ? 'border-red-500' : 'border-gray-300'}`} />
                                                    {formData.arquivoRGRespPagVerso && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRespPagVerso.name}</p>}
                                                    {errors.arquivoRGRespPagVerso && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRespPagVerso}</p>}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">Conta de Energia (PDF ou Imagem) *</label>
                                    <input type="file" name="arquivoConta" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoConta ? 'border-red-500' : 'border-gray-300'}`} />
                                    {formData.arquivoConta && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoConta.name}</p>}
                                    {errors.arquivoConta && <p className="text-red-500 text-sm mt-1">{errors.arquivoConta}</p>}
                                </div>

                                <div className="border-t pt-6 mt-6 space-y-3">
                                    <div className="bg-blue-50 p-4 rounded-lg">
                                        <label className="flex items-start cursor-pointer">
                                            <input type="checkbox" name="aceiteTermoAdesao" checked={formData.aceiteTermoAdesao} onChange={handleInputChange} className="mr-3 mt-1 w-5 h-5" />
                                            <span className="text-sm">Estou ciente que serei o responsável pela assinatura do termo de adesão e do registro/assinatura do(a) representante legal da contraprestadora *</span>
                                        </label>
                                        {errors.aceiteTermoAdesao && <p className="text-red-500 text-sm mt-1">{errors.aceiteTermoAdesao}</p>}
                                    </div>
                                    <div className="bg-blue-50 p-4 rounded-lg">
                                        <label className="flex items-start cursor-pointer">
                                            <input type="checkbox" name="aceiteDadosPessoais" checked={formData.aceiteDadosPessoais} onChange={handleInputChange} className="mr-3 mt-1 w-5 h-5" />
                                            <span className="text-sm">Autorizo o Tratamento de Dados Pessoais (conforme indicativo de acordo com a LGPD) *</span>
                                        </label>
                                        {errors.aceiteDadosPessoais && <p className="text-red-500 text-sm mt-1">{errors.aceiteDadosPessoais}</p>}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex justify-between mt-8 pt-6 border-t">
                            {step > 1 && (
                                <button onClick={() => setStep(step - 1)} disabled={loading} className="px-6 py-3 bg-gray-200 rounded-lg hover:bg-gray-300 disabled:opacity-50">
                                    Voltar
                                </button>
                            )}
                            <div className="flex-1"></div>
                            {step < 5 ? (
                                <button onClick={handleNext} className="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                    Prosseguir
                                </button>
                            ) : (
                                <button onClick={handleNext} disabled={loading} className="px-8 py-3 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 disabled:opacity-50">
                                    Revisar Dados
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<EnergyContractForm />, document.getElementById('root'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBY Energy - Proposta de Energia Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step { display: none; }
        .step.active { display: block; }
        .progress-bar { transition: width 0.3s ease; }
        input:invalid:not(:placeholder-shown) { border-color: #ef4444; }
        input:valid:not(:placeholder-shown) { border-color: #10b981; }
        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-green-50 min-h-screen">
    
    <header class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <img src="https://uuaqmwnfjopgjmjjchmw.supabase.co/storage/v1/object/public/logos/Logo%20Oby%20-%20Baixa%20Qualidade.png" alt="OBY Energy" class="h-12">
            <h1 class="text-xl font-bold text-gray-800 hidden md:block">Proposta de Energia Solar</h1>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="flex justify-between mb-2 text-sm text-gray-600">
                <span>Passo <span id="currentStep">1</span> de 6</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progressBar" class="progress-bar bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 pb-12">
        <form id="propostaForm" class="bg-white rounded-xl shadow-lg p-8">
            
            <div class="step active" data-step="1">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Você é pessoa física ou jurídica?</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="tipo_pessoa" value="fisica" class="peer sr-only" required>
                        <div class="p-6 border-2 border-gray-200 rounded-lg hover:border-blue-500 peer-checked:border-blue-600 peer-checked:bg-blue-50 transition">
                            <div class="text-4xl mb-2">👤</div>
                            <h3 class="text-xl font-semibold">Pessoa Física</h3>
                            <p class="text-gray-600 text-sm mt-2">Para residências e pessoas individuais</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="tipo_pessoa" value="juridica" class="peer sr-only" required>
                        <div class="p-6 border-2 border-gray-200 rounded-lg hover:border-blue-500 peer-checked:border-blue-600 peer-checked:bg-blue-50 transition">
                            <div class="text-4xl mb-2">🏢</div>
                            <h3 class="text-xl font-semibold">Pessoa Jurídica</h3>
                            <p class="text-gray-600 text-sm mt-2">Para empresas e estabelecimentos</p>
                        </div>
                    </label>
                </div>
            </div>

            <div class="step" data-step="2">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Dados Cadastrais</h2>
                <div id="camposPessoaFisica" class="space-y-4" style="display: none;">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nome *</label>
                            <input type="text" name="nome" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="Seu nome">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Sobrenome *</label>
                            <input type="text" name="sobrenome" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="Seu sobrenome">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">CPF *</label>
                            <input type="text" name="cpf" id="cpf" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="000.000.000-00" maxlength="14">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">RG *</label>
                            <input type="text" name="rg" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="00.000.000-0">
                        </div>
                    </div>
                </div>
                <div id="camposPessoaJuridica" class="space-y-4" style="display: none;">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Razão Social *</label>
                            <input type="text" name="razao_social" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="Razão Social">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nome Fantasia *</label>
                            <input type="text" name="nome_fantasia" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="Nome Fantasia">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">CNPJ *</label>
                        <input type="text" name="cnpj" id="cnpj" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="00.000.000/0000-00" maxlength="18">
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mt-6 mb-4">Representante Legal 1 *</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nome *</label>
                            <input type="text" name="representante_legal_1" class="w-full p-3 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">CPF *</label>
                            <input type="text" name="cpf_representante_1" class="w-full p-3 border border-gray-300 rounded-lg" maxlength="14">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">RG *</label>
                            <input type="text" name="rg_representante_1" class="w-full p-3 border border-gray-300 rounded-lg">
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mt-6 mb-4">Representante Legal 2 (Opcional)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nome</label>
                            <input type="text" name="representante_legal_2" class="w-full p-3 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">CPF</label>
                            <input type="text" name="cpf_representante_2" class="w-full p-3 border border-gray-300 rounded-lg" maxlength="14">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">RG</label>
                            <input type="text" name="rg_representante_2" class="w-full p-3 border border-gray-300 rounded-lg">
                        </div>
                    </div>
                </div>
                <div class="space-y-4 mt-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                            <input type="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Telefone *</label>
                            <input type="tel" name="telefone" id="telefone" class="w-full p-3 border border-gray-300 rounded-lg" maxlength="15" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="step" data-step="3">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Endereço</h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">CEP *</label>
                            <input type="text" name="cep" id="cep" class="w-full p-3 border border-gray-300 rounded-lg" maxlength="9" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Logradouro *</label>
                            <input type="text" name="logradouro" id="logradouro" class="w-full p-3 border border-gray-300 rounded-lg" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Número *</label>
                            <input type="text" name="numero_endereco" class="w-full p-3 border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Complemento</label>
                            <input type="text" name="complemento" class="w-full p-3 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Bairro *</label>
                            <input type="text" name="bairro" id="bairro" class="w-full p-3 border border-gray-300 rounded-lg" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Cidade *</label>
                            <input type="text" name="cidade" id="cidade" class="w-full p-3 border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Estado *</label>
                            <input type="text" name="estado" id="estado" class="w-full p-3 border border-gray-300 rounded-lg" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="step" data-step="4">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Dados de Energia</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Distribuidora *</label>
                        <select name="distribuidora_energia" class="w-full p-3 border border-gray-300 rounded-lg" required>
                            <option value="COPEL">COPEL</option>
                            <option value="CELESC">CELESC</option>
                            <option value="CPFL">CPFL</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nº Instalação *</label>
                            <input type="text" name="numero_instalacao" class="w-full p-3 border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tipo Conexão *</label>
                            <select name="tipo_conexao" class="w-full p-3 border border-gray-300 rounded-lg" required>
                                <option value="">Selecione</option>
                                <option value="monofasico">Monofásico</option>
                                <option value="bifasico">Bifásico</option>
                                <option value="trifasico">Trifásico</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Consumo (kWh) *</label>
                        <input type="number" name="consumo_kw" id="consumo_kw" class="w-full p-3 border border-gray-300 rounded-lg" required>
                    </div>
                    <div id="resultadoEconomia" class="p-4 bg-green-50 rounded-lg"></div>
                </div>
            </div>

            <div class="step" data-step="5">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Upload de Documentos</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Conta de Energia *</label>
                        <input type="file" name="conta_energia" class="w-full p-3 border border-gray-300 rounded-lg" required>
                    </div>
                    <div id="uploadPessoaFisica" style="display: none;">
                        <label class="block text-sm font-medium text-gray-700 mb-2">RG Frente *</label>
                        <input type="file" name="rg_frente" id="rg_frente" class="w-full p-3 border border-gray-300 rounded-lg">
                    </div>
                    <div id="uploadPessoaJuridica" style="display: none;">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Contrato Social *</label>
                        <input type="file" name="contrato_social" id="contrato_social" class="w-full p-3 border border-gray-300 rounded-lg">
                    </div>
                </div>
            </div>

            <div class="step" data-step="6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Revisão e Termos</h2>
                <div id="resumoProposta" class="bg-gray-50 p-4 rounded-lg mb-6"></div>
                <div class="space-y-4">
                    <label class="flex items-start">
                        <input type="checkbox" name="aceite_termo_adesao" class="mt-1 mr-3" required>
                        <span class="text-sm">Aceito os termos *</span>
                    </label>
                    <label class="flex items-start">
                        <input type="checkbox" name="aceite_dados_pessoais" class="mt-1 mr-3" required>
                        <span class="text-sm">Autorizo dados *</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-between mt-8">
                <button type="button" id="btnVoltar" class="px-6 py-3 bg-gray-300 rounded-lg" style="display: none;">← Voltar</button>
                <div></div>
                <button type="button" id="btnProximo" class="px-6 py-3 bg-blue-600 text-white rounded-lg">Próximo →</button>
                <button type="submit" id="btnEnviar" class="px-6 py-3 bg-green-600 text-white rounded-lg" style="display: none;">✓ Enviar</button>
            </div>
        </form>
    </div>

    <div id="modalSucesso" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style="display: none;">
        <div class="bg-white p-8 rounded-xl text-center">
            <div class="text-6xl mb-4">✅</div>
            <h2 class="text-2xl font-bold mb-4">Sucesso!</h2>
            <p class="mb-6">Proposta enviada com sucesso!</p>
            <button onclick="location.reload()" class="px-6 py-3 bg-blue-600 text-white rounded-lg">OK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';
        
        let currentStep = 1;
        const totalSteps = 6;
        let propostaId = null;

        function showStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.querySelector(`[data-step="${step}"]`).classList.add('active');
            currentStep = step;
            document.getElementById('currentStep').textContent = step;
            document.getElementById('progressBar').style.width = `${(step/totalSteps)*100}%`;
            document.getElementById('progressPercent').textContent = `${Math.round((step/totalSteps)*100)}%`;
            document.getElementById('btnVoltar').style.display = step > 1 ? 'block' : 'none';
            document.getElementById('btnProximo').style.display = step < totalSteps ? 'block' : 'none';
            document.getElementById('btnEnviar').style.display = step === totalSteps ? 'block' : 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (step === 6) gerarResumo();
        }

        async function salvarEtapa(step) {
            console.log(`🔵 Salvando Etapa ${step}...`);
            const form = document.getElementById('propostaForm');
            const formData = new FormData(form);
            let dados = { status: 'pendente' };
            formData.forEach((value, key) => {
                if (value) dados[key] = value;
            });
            dados.aceite_termo_adesao = formData.get('aceite_termo_adesao') === 'on';
            dados.aceite_dados_pessoais = formData.get('aceite_dados_pessoais') === 'on';
            if (dados.consumo_kw) dados.consumo_kw = parseInt(dados.consumo_kw);
            
            try {
                if (!propostaId) {
                    console.log('🔵 Criando...');
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(dados)
                    });
                    const result = await response.json();
                    if (response.ok && result[0]) {
                        propostaId = result[0].id;
                        console.log(`✅ CRIADA! ID: ${propostaId}`);
                        return true;
                    }
                } else {
                    console.log(`🔵 Atualizando ${propostaId}...`);
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas?id=eq.${propostaId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(dados)
                    });
                    if (response.ok) {
                        console.log(`✅ ATUALIZADA! Etapa ${step}`);
                        return true;
                    }
                }
            } catch (error) {
                console.error('❌ ERRO:', error);
                alert('Erro ao salvar: ' + error.message);
            }
            return false;
        }

        document.getElementById('btnProximo').addEventListener('click', async () => {
            const btn = document.getElementById('btnProximo');
            btn.disabled = true;
            btn.textContent = 'Salvando...';
            const salvou = await salvarEtapa(currentStep);
            btn.disabled = false;
            btn.textContent = 'Próximo →';
            if (salvou) showStep(currentStep + 1);
        });

        document.getElementById('btnVoltar').addEventListener('click', () => {
            showStep(currentStep - 1);
        });

        document.querySelectorAll('input[name="tipo_pessoa"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'fisica') {
                    document.getElementById('camposPessoaFisica').style.display = 'block';
                    document.getElementById('camposPessoaJuridica').style.display = 'none';
                    document.getElementById('uploadPessoaFisica').style.display = 'block';
                    document.getElementById('uploadPessoaJuridica').style.display = 'none';
                } else {
                    document.getElementById('camposPessoaFisica').style.display = 'none';
                    document.getElementById('camposPessoaJuridica').style.display = 'block';
                    document.getElementById('uploadPessoaFisica').style.display = 'none';
                    document.getElementById('uploadPessoaJuridica').style.display = 'block';
                }
            });
        });

        document.getElementById('cep')?.addEventListener('blur', async (e) => {
            const cep = e.target.value.replace(/\D/g, '');
            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        document.getElementById('logradouro').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('estado').value = data.uf;
                    }
                } catch (error) {
                    console.error('Erro CEP:', error);
                }
            }
        });

        document.getElementById('consumo_kw')?.addEventListener('input', () => {
            const consumo = parseFloat(document.getElementById('consumo_kw').value) || 0;
            const economia = (consumo * 0.85 * 0.15).toFixed(2);
            document.getElementById('resultadoEconomia').innerHTML = `
                <p class="font-semibold">Economia Estimada:</p>
                <p class="text-green-600 text-xl font-bold">R$ ${economia}/mês</p>
            `;
        });

        function gerarResumo() {
            const form = document.getElementById('propostaForm');
            const formData = new FormData(form);
            let html = '<p><strong>Resumo:</strong></p>';
            html += `<p>Email: ${formData.get('email')}</p>`;
            html += `<p>Consumo: ${formData.get('consumo_kw')} kWh</p>`;
            document.getElementById('resumoProposta').innerHTML = html;
        }

        document.getElementById('propostaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const salvou = await salvarEtapa(6);
            if (salvou) {
                document.getElementById('modalSucesso').style.display = 'flex';
            }
        });
    </script>
</body>
</html>

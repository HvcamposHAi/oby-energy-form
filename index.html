<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBY Energy - Proposta de Energia Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step { display: none; }
        .step.active { display: block; }
        .progress-bar { transition: width 0.3s ease; }
        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-green-50 min-h-screen">
    
    <header class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <h1 class="text-xl font-bold text-gray-800">Proposta de Energia Solar - OBY Energy</h1>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="flex justify-between mb-2 text-sm text-gray-600">
                <span>Passo <span id="currentStep">1</span> de 6</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progressBar" class="progress-bar bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 pb-12">
        <form id="propostaForm" class="bg-white rounded-xl shadow-lg p-8">
            
            <!-- PASSO 1 -->
            <div class="step active" data-step="1">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Você é pessoa física ou jurídica?</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="tipo_pessoa" value="fisica" class="peer sr-only" required>
                        <div class="p-6 border-2 border-gray-200 rounded-lg hover:border-blue-500 peer-checked:border-blue-600 peer-checked:bg-blue-50 transition">
                            <div class="text-4xl mb-2">👤</div>
                            <h3 class="text-xl font-semibold">Pessoa Física</h3>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="tipo_pessoa" value="juridica" class="peer sr-only" required>
                        <div class="p-6 border-2 border-gray-200 rounded-lg hover:border-blue-500 peer-checked:border-blue-600 peer-checked:bg-blue-50 transition">
                            <div class="text-4xl mb-2">🏢</div>
                            <h3 class="text-xl font-semibold">Pessoa Jurídica</h3>
                        </div>
                    </label>
                </div>
            </div>

            <!-- PASSO 2 -->
            <div class="step" data-step="2">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Dados Cadastrais</h2>
                
                <div id="camposPessoaFisica" style="display: none;">
                    <input type="text" name="nome" placeholder="Nome" class="w-full p-3 border mb-3 rounded">
                    <input type="text" name="sobrenome" placeholder="Sobrenome" class="w-full p-3 border mb-3 rounded">
                    <input type="text" name="cpf" placeholder="CPF" class="w-full p-3 border mb-3 rounded">
                    <input type="text" name="rg" placeholder="RG" class="w-full p-3 border mb-3 rounded">
                </div>

                <div id="camposPessoaJuridica" style="display: none;">
                    <input type="text" name="razao_social" placeholder="Razão Social" class="w-full p-3 border mb-3 rounded">
                    <input type="text" name="nome_fantasia" placeholder="Nome Fantasia" class="w-full p-3 border mb-3 rounded">
                    <input type="text" name="cnpj" placeholder="CNPJ" class="w-full p-3 border mb-3 rounded">
                </div>

                <input type="email" name="email" placeholder="Email" class="w-full p-3 border mb-3 rounded" required>
                <input type="tel" name="telefone" placeholder="Telefone" class="w-full p-3 border rounded" required>
            </div>

            <!-- PASSO 3 -->
            <div class="step" data-step="3">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Endereço</h2>
                <input type="text" name="cep" placeholder="CEP" class="w-full p-3 border mb-3 rounded" required>
                <input type="text" name="logradouro" placeholder="Logradouro" class="w-full p-3 border mb-3 rounded" required>
                <input type="text" name="numero_endereco" placeholder="Número" class="w-full p-3 border mb-3 rounded" required>
                <input type="text" name="bairro" placeholder="Bairro" class="w-full p-3 border mb-3 rounded" required>
                <input type="text" name="cidade" placeholder="Cidade" class="w-full p-3 border mb-3 rounded" required>
                <input type="text" name="estado" placeholder="Estado (UF)" class="w-full p-3 border rounded" required>
            </div>

            <!-- PASSO 4 -->
            <div class="step" data-step="4">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Dados de Energia</h2>
                <input type="text" name="numero_instalacao" placeholder="Número de Instalação" class="w-full p-3 border mb-3 rounded" required>
                <select name="tipo_conexao" class="w-full p-3 border mb-3 rounded" required>
                    <option value="">Tipo de Conexão</option>
                    <option value="monofasico">Monofásico</option>
                    <option value="bifasico">Bifásico</option>
                    <option value="trifasico">Trifásico</option>
                </select>
                <input type="number" name="consumo_kw" placeholder="Consumo Mensal (kWh)" class="w-full p-3 border rounded" required>
            </div>

            <!-- PASSO 5 -->
            <div class="step" data-step="5">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Upload de Documentos</h2>
                <p class="mb-4 text-gray-600">Envie os documentos necessários</p>
                <input type="file" name="conta_energia" class="w-full p-3 border mb-3 rounded">
            </div>

            <!-- PASSO 6 -->
            <div class="step" data-step="6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Revisão e Termos</h2>
                <div id="resumo" class="bg-gray-50 p-4 rounded mb-4"></div>
                <label class="flex items-center mb-3">
                    <input type="checkbox" name="aceite_termo_adesao" required class="mr-2">
                    <span>Aceito os termos</span>
                </label>
                <label class="flex items-center">
                    <input type="checkbox" name="aceite_dados_pessoais" required class="mr-2">
                    <span>Autorizo tratamento de dados</span>
                </label>
            </div>

            <!-- Botões -->
            <div class="flex justify-between mt-8">
                <button type="button" id="btnVoltar" class="px-6 py-3 bg-gray-300 rounded" style="display: none;">Voltar</button>
                <div></div>
                <button type="button" id="btnProximo" class="px-6 py-3 bg-blue-600 text-white rounded">Próximo</button>
                <button type="submit" id="btnEnviar" class="px-6 py-3 bg-green-600 text-white rounded" style="display: none;">Enviar</button>
            </div>
        </form>
    </div>

    <div id="modalSucesso" style="display: none;" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl text-center">
            <h2 class="text-2xl font-bold mb-4">✅ Sucesso!</h2>
            <p>Proposta enviada com sucesso!</p>
            <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-blue-600 text-white rounded">OK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';
        
        let currentStep = 1;
        let propostaId = null;

        function showStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.querySelector(`[data-step="${step}"]`).classList.add('active');
            currentStep = step;
            
            document.getElementById('currentStep').textContent = step;
            document.getElementById('progressBar').style.width = `${(step/6)*100}%`;
            document.getElementById('progressPercent').textContent = `${Math.round((step/6)*100)}%`;
            
            document.getElementById('btnVoltar').style.display = step > 1 ? 'block' : 'none';
            document.getElementById('btnProximo').style.display = step < 6 ? 'block' : 'none';
            document.getElementById('btnEnviar').style.display = step === 6 ? 'block' : 'none';
        }

        async function salvarEtapa(step) {
            const form = document.getElementById('propostaForm');
            const formData = new FormData(form);
            const dados = {};
            
            formData.forEach((value, key) => {
                if (value) dados[key] = value;
            });

            dados.status = 'pendente';

            try {
                if (!propostaId) {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(dados)
                    });
                    const result = await response.json();
                    if (result[0]) {
                        propostaId = result[0].id;
                        console.log('✅ Criado:', propostaId);
                        return true;
                    }
                } else {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas?id=eq.${propostaId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(dados)
                    });
                    if (response.ok) {
                        console.log('✅ Atualizado:', propostaId);
                        return true;
                    }
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar: ' + error.message);
            }
            return false;
        }

        document.getElementById('btnProximo').addEventListener('click', async () => {
            const salvou = await salvarEtapa(currentStep);
            if (salvou) showStep(currentStep + 1);
        });

        document.getElementById('btnVoltar').addEventListener('click', () => {
            showStep(currentStep - 1);
        });

        document.querySelectorAll('input[name="tipo_pessoa"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'fisica') {
                    document.getElementById('camposPessoaFisica').style.display = 'block';
                    document.getElementById('camposPessoaJuridica').style.display = 'none';
                } else {
                    document.getElementById('camposPessoaFisica').style.display = 'none';
                    document.getElementById('camposPessoaJuridica').style.display = 'block';
                }
            });
        });

        document.getElementById('propostaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const salvou = await salvarEtapa(6);
            if (salvou) {
                document.getElementById('modalSucesso').style.display = 'flex';
            }
        });
    </script>
</body>
</html>

<script>
    const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';

    let currentStep = 1;
    const totalSteps = 6;
    let tarifaKwh = 0.85;
    let propostaId = null; // ID da proposta sendo editada

    // Verificar se já existe proposta em andamento
    window.addEventListener('load', () => {
        const savedId = localStorage.getItem('proposta_em_andamento');
        if (savedId) {
            if (confirm('Você tem uma proposta em andamento. Deseja continuar de onde parou?')) {
                propostaId = savedId;
                carregarPropostaExistente(savedId);
            } else {
                localStorage.removeItem('proposta_em_andamento');
            }
        }
    });

    // Carregar proposta existente
    async function carregarPropostaExistente(id) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas?id=eq.${id}`, {
                headers: {
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'apikey': SUPABASE_KEY
                }
            });
            const data = await response.json();
            if (data && data.length > 0) {
                preencherFormulario(data[0]);
            }
        } catch (error) {
            console.error('Erro ao carregar proposta:', error);
        }
    }

    // Preencher formulário com dados salvos
    function preencherFormulario(dados) {
        const form = document.getElementById('propostaForm');
        for (const [key, value] of Object.entries(dados)) {
            const input = form.elements[key];
            if (input && value) {
                if (input.type === 'radio') {
                    form.querySelectorAll(`input[name="${key}"][value="${value}"]`).forEach(r => r.checked = true);
                } else if (input.type === 'checkbox') {
                    input.checked = value;
                } else {
                    input.value = value;
                }
            }
        }
        // Disparar evento change no tipo_pessoa para mostrar campos corretos
        if (dados.tipo_pessoa) {
            const radio = form.querySelector(`input[name="tipo_pessoa"][value="${dados.tipo_pessoa}"]`);
            if (radio) {
                radio.dispatchEvent(new Event('change'));
            }
        }
    }

    // Carregar tarifa do banco
    async function carregarTarifa() {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/configuracoes?chave=eq.tarifa_kwh`, {
                headers: {
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'apikey': SUPABASE_KEY
                }
            });
            const data = await response.json();
            if (data && data.length > 0) {
                tarifaKwh = parseFloat(data[0].valor);
            }
        } catch (error) {
            console.error('Erro ao carregar tarifa:', error);
        }
    }

    carregarTarifa();

    // Navegação entre passos
    function showStep(step) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.querySelector(`[data-step="${step}"]`).classList.add('active');
        
        currentStep = step;
        document.getElementById('currentStep').textContent = step;
        document.getElementById('progressBar').style.width = `${(step / totalSteps) * 100}%`;
        document.getElementById('progressPercent').textContent = `${Math.round((step / totalSteps) * 100)}%`;
        
        document.getElementById('btnVoltar').style.display = step > 1 ? 'block' : 'none';
        document.getElementById('btnProximo').style.display = step < totalSteps ? 'block' : 'none';
        document.getElementById('btnEnviar').style.display = step === totalSteps ? 'block' : 'none';

        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (step === 6) {
            gerarResumo();
        }
    }

    // Salvar etapa no banco
    async function salvarEtapa(step) {
        const form = document.getElementById('propostaForm');
        const formData = new FormData(form);
        
        let dados = {};
        
        // Coletar dados da etapa atual
        switch(step) {
            case 1:
                dados = {
                    tipo_pessoa: formData.get('tipo_pessoa'),
                    status: 'pendente'
                };
                break;
                
            case 2:
                dados = {
                    nome: formData.get('nome') || formData.get('razao_social'),
                    sobrenome: formData.get('sobrenome'),
                    cpf: formData.get('cpf'),
                    rg: formData.get('rg'),
                    cnpj: formData.get('cnpj'),
                    razao_social: formData.get('razao_social'),
                    nome_fantasia: formData.get('nome_fantasia'),
                    representante_legal_1: formData.get('representante_legal_1'),
                    cpf_representante_1: formData.get('cpf_representante_1'),
                    rg_representante_1: formData.get('rg_representante_1'),
                    representante_legal_2: formData.get('representante_legal_2'),
                    cpf_representante_2: formData.get('cpf_representante_2'),
                    rg_representante_2: formData.get('rg_representante_2'),
                    email: formData.get('email'),
                    telefone: formData.get('telefone')
                };
                break;
                
            case 3:
                dados = {
                    cep: formData.get('cep'),
                    logradouro: formData.get('logradouro'),
                    numero_endereco: formData.get('numero_endereco'),
                    complemento: formData.get('complemento'),
                    bairro: formData.get('bairro'),
                    cidade: formData.get('cidade'),
                    estado: formData.get('estado'),
                    logradouro_instalacao: formData.get('logradouro_instalacao'),
                    numero_instalacao_endereco: formData.get('numero_instalacao_endereco'),
                    complemento_instalacao: formData.get('complemento_instalacao'),
                    bairro_instalacao: formData.get('bairro_instalacao'),
                    cidade_instalacao: formData.get('cidade_instalacao'),
                    estado_instalacao: formData.get('estado_instalacao')
                };
                break;
                
            case 4:
                dados = {
                    distribuidora_energia: formData.get('distribuidora_energia'),
                    numero_instalacao: formData.get('numero_instalacao'),
                    numero_cliente: formData.get('numero_cliente'),
                    tipo_conexao: formData.get('tipo_conexao'),
                    modalidade_tarifaria: formData.get('modalidade_tarifaria'),
                    consumo_kw: parseInt(formData.get('consumo_kw')),
                    economia_mensal: parseFloat(formData.get('economia_mensal')),
                    economia_anual: parseFloat(formData.get('economia_anual')),
                    desconto: parseInt(formData.get('desconto')),
                    cupom: formData.get('cupom')
                };
                break;
                
            case 5:
                // Upload de arquivos será feito aqui
                const timestamp = Date.now();
                const arquivos = [
                    'conta_energia',
                    'rg_frente', 'rg_verso',
                    'contrato_social',
                    'rg_rep_1_frente', 'rg_rep_1_verso',
                    'rg_rep_2_frente', 'rg_rep_2_verso'
                ];
                
                document.getElementById('modalLoading').style.display = 'flex';
                
                for (const campo of arquivos) {
                    const file = form.elements[campo]?.files[0];
                    if (file) {
                        const path = `propostas/${timestamp}_${campo}_${file.name}`;
                        const url = await uploadArquivo(file, 'documentos', path);
                        if (url) {
                            dados[`url_${campo}`] = url;
                        }
                    }
                }
                
                document.getElementById('modalLoading').style.display = 'none';
                break;
                
            case 6:
                dados = {
                    aceite_termo_adesao: formData.get('aceite_termo_adesao') === 'on',
                    aceite_dados_pessoais: formData.get('aceite_dados_pessoais') === 'on',
                    observacoes: formData.get('observacoes')
                };
                break;
        }
        
        try {
            if (!propostaId) {
                // INSERT - Criar novo registro
                const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(dados)
                });
                
                const result = await response.json();
                if (response.ok && result[0]) {
                    propostaId = result[0].id;
                    localStorage.setItem('proposta_em_andamento', propostaId);
                    console.log('✅ Proposta criada:', propostaId);
                    return true;
                } else {
                    throw new Error('Erro ao criar proposta');
                }
            } else {
                // UPDATE - Atualizar registro existente
                const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas?id=eq.${propostaId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(dados)
                });
                
                if (response.ok) {
                    console.log('✅ Proposta atualizada - Etapa', step);
                    return true;
                } else {
                    throw new Error('Erro ao atualizar proposta');
                }
            }
        } catch (error) {
            console.error('Erro ao salvar etapa:', error);
            alert('Erro ao salvar dados. Tente novamente.');
            return false;
        }
    }

    // Botão próximo - valida e salva antes de avançar
    document.getElementById('btnProximo').addEventListener('click', async () => {
        if (validarPasso(currentStep)) {
            const salvou = await salvarEtapa(currentStep);
            if (salvou) {
                showStep(currentStep + 1);
            }
        }
    });

    document.getElementById('btnVoltar').addEventListener('click', () => {
        showStep(currentStep - 1);
    });

    // Validação de passos
    function validarPasso(step) {
        const stepElement = document.querySelector(`[data-step="${step}"]`);
        const inputs = stepElement.querySelectorAll('input[required], select[required], textarea[required]');
        
        for (let input of inputs) {
            if (!input.value && input.offsetParent !== null) {
                input.focus();
                input.classList.add('border-red-500');
                setTimeout(() => input.classList.remove('border-red-500'), 2000);
                alert('Por favor, preencha todos os campos obrigatórios');
                return false;
            }
        }
        return true;
    }

    // Tipo de pessoa - mostrar campos específicos
    document.querySelectorAll('input[name="tipo_pessoa"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            const tipo = e.target.value;
            
            if (tipo === 'fisica') {
                document.getElementById('camposPessoaFisica').style.display = 'block';
                document.getElementById('camposPessoaJuridica').style.display = 'none';
                document.getElementById('uploadPessoaFisica').style.display = 'block';
                document.getElementById('uploadPessoaJuridica').style.display = 'none';
                
                document.querySelector('input[name="nome"]').required = true;
                document.querySelector('input[name="sobrenome"]').required = true;
                document.querySelector('input[name="cpf"]').required = true;
                document.querySelector('input[name="rg"]').required = true;
                document.getElementById('rg_frente').required = true;
                document.getElementById('rg_verso').required = true;
                
                document.querySelector('input[name="razao_social"]').required = false;
                document.querySelector('input[name="nome_fantasia"]').required = false;
                document.querySelector('input[name="cnpj"]').required = false;
                
            } else {
                document.getElementById('camposPessoaFisica').style.display = 'none';
                document.getElementById('camposPessoaJuridica').style.display = 'block';
                document.getElementById('uploadPessoaFisica').style.display = 'none';
                document.getElementById('uploadPessoaJuridica').style.display = 'block';
                
                document.querySelector('input[name="razao_social"]').required = true;
                document.querySelector('input[name="nome_fantasia"]').required = true;
                document.querySelector('input[name="cnpj"]').required = true;
                document.querySelector('input[name="representante_legal_1"]').required = true;
                document.querySelector('input[name="cpf_representante_1"]').required = true;
                document.querySelector('input[name="rg_representante_1"]').required = true;
                document.getElementById('contrato_social').required = true;
                document.getElementById('rg_rep_1_frente').required = true;
                document.getElementById('rg_rep_1_verso').required = true;
                
                document.querySelector('input[name="nome"]').required = false;
                document.querySelector('input[name="sobrenome"]').required = false;
                document.querySelector('input[name="cpf"]').required = false;
                document.querySelector('input[name="rg"]').required = false;
                document.getElementById('rg_frente').required = false;
                document.getElementById('rg_verso').required = false;
            }
        });
    });

    // Máscaras
    document.getElementById('cpf')?.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length <= 11) {
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        }
        e.target.value = value;
    });

    document.getElementById('cnpj')?.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length <= 14) {
            value = value.replace(/(\d{2})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1/$2');
            value = value.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
        }
        e.target.value = value;
    });

    document.getElementById('telefone').addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length <= 11) {
            value = value.replace(/(\d{2})(\d)/, '($1) $2');
            value = value.replace(/(\d{5})(\d)/, '$1-$2');
        }
        e.target.value = value;
    });

    document.getElementById('cep').addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length <= 8) {
            value = value.replace(/(\d{5})(\d)/, '$1-$2');
        }
        e.target.value = value;
    });

    // Buscar CEP
    document.getElementById('cep').addEventListener('blur', async (e) => {
        const cep = e.target.value.replace(/\D/g, '');
        if (cep.length === 8) {
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                
                if (!data.erro) {
                    document.getElementById('logradouro').value = data.logradouro;
                    document.getElementById('bairro').value = data.bairro;
                    document.getElementById('cidade').value = data.localidade;
                    document.getElementById('estado').value = data.uf;
                } else {
                    alert('CEP não encontrado');
                }
            } catch (error) {
                console.error('Erro ao buscar CEP:', error);
            }
        }
    });

    // Endereço de instalação diferente
    document.getElementById('enderecoInstalacaoDiferente').addEventListener('change', (e) => {
        document.getElementById('enderecoInstalacao').style.display = e.target.checked ? 'block' : 'none';
    });

    // Calcular economia
    document.getElementById('consumo_kw').addEventListener('input', calcularEconomia);
    document.getElementById('cupom').addEventListener('blur', validarCupom);

    function calcularEconomia() {
        const consumo = parseFloat(document.getElementById('consumo_kw').value) || 0;
        const cupom = document.getElementById('cupom').value.trim();
        
        let desconto = 15;
        
        if (cupom.toUpperCase() === 'ENERGIA20') {
            desconto = 20;
        }
        
        const economia_mensal = (consumo * tarifaKwh * desconto / 100).toFixed(2);
        const economia_anual = (economia_mensal * 12).toFixed(2);
        
        document.getElementById('resultadoEconomia').innerHTML = `
            <p class="font-semibold text-lg">Economia Estimada:</p>
            <p class="text-green-600 font-bold text-xl">R$ ${economia_mensal} / mês</p>
            <p class="text-green-600 font-bold text-xl">R$ ${economia_anual} / ano</p>
            <p class="text-sm text-gray-600 mt-2">Desconto de ${desconto}% sobre a tarifa de energia</p>
        `;
        
        document.querySelector('input[name="economia_mensal"]')?.remove();
        document.querySelector('input[name="economia_anual"]')?.remove();
        document.querySelector('input[name="desconto"]')?.remove();
        
        const form = document.getElementById('propostaForm');
        form.insertAdjacentHTML('beforeend', `
            <input type="hidden" name="economia_mensal" value="${economia_mensal}">
            <input type="hidden" name="economia_anual" value="${economia_anual}">
            <input type="hidden" name="desconto" value="${desconto}">
        `);
    }

    function validarCupom() {
        const cupom = document.getElementById('cupom').value.trim();
        const statusEl = document.getElementById('cupomStatus');
        
        if (cupom === '') {
            statusEl.textContent = '';
            return;
        }
        
        if (cupom.toUpperCase() === 'ENERGIA20') {
            statusEl.textContent = '✅ Cupom válido! Desconto de 20%';
            statusEl.className = 'text-sm mt-1 text-green-600';
            calcularEconomia();
        } else {
            statusEl.textContent = '❌ Cupom inválido';
            statusEl.className = 'text-sm mt-1 text-red-600';
        }
    }

    // Gerar resumo
    function gerarResumo() {
        const form = document.getElementById('propostaForm');
        const formData = new FormData(form);
        const tipoPessoa = formData.get('tipo_pessoa');
        
        let html = '';
        
        if (tipoPessoa === 'fisica') {
            html += `<p><strong>Nome:</strong> ${formData.get('nome')} ${formData.get('sobrenome')}</p>`;
            html += `<p><strong>CPF:</strong> ${formData.get('cpf')}</p>`;
        } else {
            html += `<p><strong>Empresa:</strong> ${formData.get('nome_fantasia')}</p>`;
            html += `<p><strong>CNPJ:</strong> ${formData.get('cnpj')}</p>`;
        }
        
        html += `<p><strong>Email:</strong> ${formData.get('email')}</p>`;
        html += `<p><strong>Telefone:</strong> ${formData.get('telefone')}</p>`;
        html += `<p><strong>Cidade:</strong> ${formData.get('cidade')} - ${formData.get('estado')}</p>`;
        html += `<p><strong>Consumo:</strong> ${formData.get('consumo_kw')} kWh/mês</p>`;
        html += `<p><strong>Economia Mensal:</strong> R$ ${formData.get('economia_mensal')}</p>`;
        html += `<p><strong>Economia Anual:</strong> R$ ${formData.get('economia_anual')}</p>`;
        
        document.getElementById('resumoProposta').innerHTML = html;
    }

    // Upload de arquivo para Supabase Storage
    async function uploadArquivo(file, bucket, path) {
        try {
            const formData = new FormData();
            formData.append('file', file);
            
            const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'apikey': SUPABASE_KEY
                },
                body: formData
            });
            
            if (response.ok) {
                return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
            } else {
                throw new Error('Erro ao fazer upload');
            }
        } catch (error) {
            console.error('Erro no upload:', error);
            return null;
        }
    }

    // Enviar formulário final
    document.getElementById('propostaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!validarPasso(6)) return;
        
        const salvou = await salvarEtapa(6);
        
        if (salvou) {
            localStorage.removeItem('proposta_em_andamento');
            document.getElementById('modalSucesso').style.display = 'flex';
        }
    });
</script>

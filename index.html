<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBY Energy - Contratação</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';
        
        const formatBRL = (valor) => {
            const num = parseFloat(valor);
            if (isNaN(num)) return '0,00';
            return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        function EnergyContractForm() {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [mostrarRevisao, setMostrarRevisao] = useState(false);
            const [propostaId, setPropostaId] = useState(null);
            const [formData, setFormData] = useState({
                cep: '', nome: '', sobrenome: '', cupom: '', 
                email: '', telefone: '',
                logradouro: '', numeroEndereco: '', complemento: '', bairro: '',
                estado: '', cidade: '',
                modalidadeTarifaria: '', distribuidoraEnergia: 'COPEL',
                arquivoConta: null, tipoConexao: '', consumoKW: '', 
                numeroInstalacao: '',
                tipoPessoa: 'fisica', cpf: '', rg: '', 
                arquivoRGFrente: null, arquivoRGVerso: null,
                cnpj: '', nomeFantasia: '', razaoSocial: '',
                representanteLegal1: '', cpfRepresentante1: '', rgRepresentante1: '', 
                arquivoRGRep1Frente: null, arquivoRGRep1Verso: null,
                contratoSocial: null,
                temResponsavelPagamento: false,
                nomeResponsavelPagamento: '', cpfResponsavelPagamento: '',
                rgResponsavelPagamento: '',
                arquivoRGRespPagFrente: null, arquivoRGRespPagVerso: null,
                aceiteTermoAdesao: false, aceiteDadosPessoais: false
            });
            const [errors, setErrors] = useState({});
            const [simulacao, setSimulacao] = useState(null);
            const [cepValidado, setCepValidado] = useState(false);
            const [estadoForaCobertura, setEstadoForaCobertura] = useState(false);

            const consumoMinimo = { trifasico: 100, bifasico: 50, monofasico: 30 };

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
                if (errors[name]) setErrors(prev => ({ ...prev, [name]: '' }));
            };

            const handleFileChange = (e) => {
                const { name, files } = e.target;
                if (files && files[0]) {
                    setFormData(prev => ({ ...prev, [name]: files[0] }));
                    if (errors[name]) setErrors(prev => ({ ...prev, [name]: '' }));
                }
            };

            const validateCEP = async () => {
                const cepRegex = /^\d{5}-?\d{3}$/;
                if (!cepRegex.test(formData.cep)) {
                    setErrors(prev => ({ ...prev, cep: 'CEP inválido' }));
                    return false;
                }
                
                try {
                    const cepLimpo = formData.cep.replace('-', '');
                    const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const data = await response.json();
                    
                    if (data.erro) {
                        setErrors(prev => ({ ...prev, cep: 'CEP não encontrado' }));
                        return false;
                    }
                    
                    setFormData(prev => ({ 
                        ...prev, 
                        estado: data.uf, 
                        cidade: data.localidade,
                        logradouro: data.logradouro || '',
                        bairro: data.bairro || '',
                    }));
                    
                    if (data.uf !== 'PR') {
                        setEstadoForaCobertura(true);
                    } else {
                        setEstadoForaCobertura(false);
                    }
                    
                    setCepValidado(true);
                    return true;
                } catch (error) {
                    setErrors(prev => ({ ...prev, cep: 'Erro ao validar CEP' }));
                    return false;
                }
            };

            const validateStep = () => {
                const newErrors = {};
                
                if (step === 1) {
                    if (!formData.cep) newErrors.cep = 'Campo obrigatório';
                    if (!formData.nome) newErrors.nome = 'Campo obrigatório';
                    if (!formData.sobrenome) newErrors.sobrenome = 'Campo obrigatório';
                    if (!formData.email) newErrors.email = 'Campo obrigatório';
                    if (!formData.telefone) newErrors.telefone = 'Campo obrigatório';
                    if (!cepValidado) newErrors.cep = 'Valide o CEP antes de continuar';
                }
                
                if (step === 2) {
                    if (!formData.logradouro) newErrors.logradouro = 'Campo obrigatório';
                    if (!formData.numeroEndereco) newErrors.numeroEndereco = 'Campo obrigatório';
                    if (!formData.bairro) newErrors.bairro = 'Campo obrigatório';
                }
                
                if (step === 3) {
                    if (!formData.modalidadeTarifaria) newErrors.modalidadeTarifaria = 'Campo obrigatório';
                    if (!formData.distribuidoraEnergia) newErrors.distribuidoraEnergia = 'Campo obrigatório';
                    if (!formData.tipoConexao) newErrors.tipoConexao = 'Campo obrigatório';
                    if (!formData.consumoKW) newErrors.consumoKW = 'Campo obrigatório';
                    if (!formData.numeroInstalacao) newErrors.numeroInstalacao = 'Campo obrigatório';
                    
                    const consumo = parseFloat(formData.consumoKW);
                    const minimo = consumoMinimo[formData.tipoConexao];
                    if (consumo < minimo) {
                        newErrors.consumoKW = `Consumo mínimo para ${formData.tipoConexao}: ${minimo} kW`;
                    }
                }
                
                if (step === 5) {
                    if (formData.tipoPessoa === 'fisica') {
                        if (!formData.cpf) newErrors.cpf = 'Campo obrigatório';
                        if (!formData.rg) newErrors.rg = 'Campo obrigatório';
                        if (!formData.arquivoRGFrente) newErrors.arquivoRGFrente = 'Campo obrigatório';
                        if (!formData.arquivoRGVerso) newErrors.arquivoRGVerso = 'Campo obrigatório';
                    } else {
                        if (!formData.cnpj) newErrors.cnpj = 'Campo obrigatório';
                        if (!formData.nomeFantasia) newErrors.nomeFantasia = 'Campo obrigatório';
                        if (!formData.razaoSocial) newErrors.razaoSocial = 'Campo obrigatório';
                        if (!formData.representanteLegal1) newErrors.representanteLegal1 = 'Campo obrigatório';
                        if (!formData.cpfRepresentante1) newErrors.cpfRepresentante1 = 'Campo obrigatório';
                        if (!formData.rgRepresentante1) newErrors.rgRepresentante1 = 'Campo obrigatório';
                        if (!formData.arquivoRGRep1Frente) newErrors.arquivoRGRep1Frente = 'Campo obrigatório';
                        if (!formData.arquivoRGRep1Verso) newErrors.arquivoRGRep1Verso = 'Campo obrigatório';
                        if (!formData.contratoSocial) newErrors.contratoSocial = 'Campo obrigatório';
                    }
                    
                    if (formData.temResponsavelPagamento) {
                        if (!formData.nomeResponsavelPagamento) newErrors.nomeResponsavelPagamento = 'Campo obrigatório';
                        if (!formData.cpfResponsavelPagamento) newErrors.cpfResponsavelPagamento = 'Campo obrigatório';
                        if (!formData.rgResponsavelPagamento) newErrors.rgResponsavelPagamento = 'Campo obrigatório';
                        if (!formData.arquivoRGRespPagFrente) newErrors.arquivoRGRespPagFrente = 'Campo obrigatório';
                        if (!formData.arquivoRGRespPagVerso) newErrors.arquivoRGRespPagVerso = 'Campo obrigatório';
                    }
                    
                    if (!formData.arquivoConta) newErrors.arquivoConta = 'Campo obrigatório';
                    if (!formData.aceiteTermoAdesao) newErrors.aceiteTermoAdesao = 'Você deve aceitar este termo';
                    if (!formData.aceiteDadosPessoais) newErrors.aceiteDadosPessoais = 'Você deve aceitar este termo';
                }
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            // CÁLCULO ORIGINAL QUE FUNCIONAVA
            const calcularSimulacao = async () => {
                // Buscar configurações do banco de dados
                let tarifaTotal = 0.842355;
                let proporcaoEnergia = 0.81;
                let proporcaoImpostos = 0.19;
                
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/configuracoes?select=*`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'apikey': SUPABASE_KEY
                        }
                    });
                    const configs = await response.json();
                    
                    configs.forEach(config => {
                        if (config.chave === 'tarifa_kwh') tarifaTotal = parseFloat(config.valor);
                        if (config.chave === 'proporcao_energia') proporcaoEnergia = parseFloat(config.valor);
                        if (config.chave === 'proporcao_impostos') proporcaoImpostos = parseFloat(config.valor);
                    });
                } catch (error) {
                    console.log('Usando valores padrão');
                }

                const consumo = parseFloat(formData.consumoKW);
                const minimo = consumoMinimo[formData.tipoConexao];
                const desconto = formData.cupom ? 0.20 : 0.15;
                
                const tarifaEnergia = tarifaTotal * proporcaoEnergia;
                const tarifaImpostos = tarifaTotal * proporcaoImpostos;
                
                const consumoMinimoValor = minimo * tarifaTotal;
                const consumoExcedente = consumo - minimo;
                const impostosNaoCompensaveis = consumoExcedente * tarifaImpostos;
                
                const energiaCativaAtual = consumoExcedente * tarifaEnergia;
                const contaAtual = consumoMinimoValor + impostosNaoCompensaveis + energiaCativaAtual;
                
                const tarifaEnergiaComDesconto = tarifaEnergia * (1 - desconto);
                const energiaCativaComDesconto = consumoExcedente * tarifaEnergiaComDesconto;
                const contaNova = consumoMinimoValor + impostosNaoCompensaveis + energiaCativaComDesconto;
                
                const economiaMensal = contaAtual - contaNova;
                const economiaAnual = economiaMensal * 12;
                const contasPorAno = 12 - (economiaAnual / contaAtual);
                
                setSimulacao({
                    contaAtual: contaAtual.toFixed(2),
                    contaNova: contaNova.toFixed(2),
                    economiaMensal: economiaMensal.toFixed(2),
                    economiaAnual: economiaAnual.toFixed(2),
                    desconto: (desconto * 100).toFixed(0),
                    consumo,
                    minimo,
                    consumoMinimoValor: consumoMinimoValor.toFixed(2),
                    impostosNaoCompensaveis: impostosNaoCompensaveis.toFixed(2),
                    energiaCativaAtual: energiaCativaAtual.toFixed(2),
                    energiaCativaComDesconto: energiaCativaComDesconto.toFixed(2),
                    contasPorAno: contasPorAno.toFixed(2),
                    consumoKW: consumo,
                    tipoConexao: formData.tipoConexao
                });
            };

            const handleNext = async () => {
                if (!validateStep()) return;
                
                if (step === 3) await calcularSimulacao();
                if (step === 5) {
                    await handleSubmit();
                    return;
                }
                
                setStep(step + 1);
            };

            const uploadFile = async (file, folder) => {
                console.log(`📤 Iniciando upload: ${file.name} para ${folder}`);
                const fileName = `${Date.now()}_${file.name}`;
                
                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/storage/v1/object/${folder}/${fileName}`,
                        {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': file.type
                            },
                            body: file
                        }
                    );
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error(`❌ Erro no upload de ${file.name}:`, errorText);
                        throw new Error(`Erro no upload de ${file.name}: ${errorText}`);
                    }
                    
                    const url = `${SUPABASE_URL}/storage/v1/object/public/${folder}/${fileName}`;
                    console.log(`✅ Upload concluído: ${url}`);
                    return url;
                } catch (error) {
                    console.error(`❌ Erro no upload de ${file.name}:`, error);
                    throw error;
                }
            };

            const handleSubmit = async () => {
                console.log('📝 Iniciando submissão da proposta...');
                setLoading(true);
                
                try {
                    // PRIMEIRO: Testar se consegue inserir dados simples
                    console.log('🧪 TESTE 1: Verificando conexão com o banco...');
                    const testeConexao = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                        method: 'GET',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    
                    if (!testeConexao.ok) {
                        const erro = await testeConexao.text();
                        console.error('❌ ERRO DE CONEXÃO:', erro);
                        throw new Error(`Erro ao conectar com o banco: ${erro}`);
                    }
                    console.log('✅ Conexão com banco OK');
                    
                    // SEGUNDO: Preparar dados MÍNIMOS primeiro
                    console.log('📝 Fase 1: Preparando dados BÁSICOS (sem uploads)...');
                    
                    const propostaMinima = {
                        nome_completo: `${formData.nome} ${formData.sobrenome}`,
                        email: formData.email,
                        telefone: formData.telefone,
                        cep: formData.cep,
                        logradouro: formData.logradouro,
                        numero_endereco: formData.numeroEndereco,
                        bairro: formData.bairro,
                        cidade: formData.cidade,
                        estado: formData.estado,
                        modalidade_tarifaria: formData.modalidadeTarifaria,
                        distribuidora_energia: formData.distribuidoraEnergia,
                        tipo_conexao: formData.tipoConexao,
                        consumo_kw: parseFloat(formData.consumoKW),
                        numero_instalacao: formData.numeroInstalacao,
                        tipo_pessoa: formData.tipoPessoa,
                        simulacao_economia_mensal: parseFloat(simulacao.economiaMensal),
                        simulacao_economia_anual: parseFloat(simulacao.economiaAnual),
                        simulacao_conta_atual: parseFloat(simulacao.contaAtual),
                        simulacao_conta_nova: parseFloat(simulacao.contaNova),
                        desconto_aplicado: parseFloat(simulacao.desconto),
                        aceite_termo_adesao: formData.aceiteTermoAdesao,
                        aceite_dados_pessoais: formData.aceiteDadosPessoais,
                        status: 'pendente'
                    };
                    
                    console.log('📊 Dados básicos preparados:', propostaMinima);
                    console.log('💾 TESTE 2: Tentando salvar dados BÁSICOS no banco...');
                    
                    const responseTeste = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(propostaMinima)
                    });
                    
                    if (!responseTeste.ok) {
                        const errorText = await responseTeste.text();
                        const errorJson = JSON.parse(errorText);
                        console.error('❌ ERRO AO SALVAR DADOS BÁSICOS:', errorJson);
                        console.error('Detalhes do erro:', {
                            codigo: errorJson.code,
                            mensagem: errorJson.message,
                            detalhes: errorJson.details,
                            hint: errorJson.hint
                        });
                        
                        throw new Error(`ERRO NO BANCO DE DADOS:\n\nCódigo: ${errorJson.code}\nMensagem: ${errorJson.message}\n\nDetalhes: ${errorJson.details || 'N/A'}\nDica: ${errorJson.hint || 'N/A'}`);
                    }
                    
                    const resultadoTeste = await responseTeste.json();
                    console.log('✅ Dados básicos salvos com sucesso! ID:', resultadoTeste[0].id);
                    
                    // TERCEIRO: Se deu certo, fazer uploads e atualizar
                    console.log('📤 Fase 2: Fazendo upload de arquivos...');
                    
                    let arquivoContaUrl = null;
                    if (formData.arquivoConta) {
                        try {
                            arquivoContaUrl = await uploadFile(formData.arquivoConta, 'contas-energia');
                        } catch (e) {
                            console.warn('⚠️ Erro no upload da conta, continuando...', e);
                        }
                    }
                    
                    let arquivoRGFrenteUrl = null;
                    if (formData.arquivoRGFrente) {
                        try {
                            arquivoRGFrenteUrl = await uploadFile(formData.arquivoRGFrente, 'documentos');
                        } catch (e) {
                            console.warn('⚠️ Erro no upload RG frente, continuando...', e);
                        }
                    }
                    
                    let arquivoRGVersoUrl = null;
                    if (formData.arquivoRGVerso) {
                        try {
                            arquivoRGVersoUrl = await uploadFile(formData.arquivoRGVerso, 'documentos');
                        } catch (e) {
                            console.warn('⚠️ Erro no upload RG verso, continuando...', e);
                        }
                    }
                    
                    let arquivoRGRep1FrenteUrl = null;
                    if (formData.arquivoRGRep1Frente) {
                        try {
                            arquivoRGRep1FrenteUrl = await uploadFile(formData.arquivoRGRep1Frente, 'documentos');
                        } catch (e) {
                            console.warn('⚠️ Erro no upload RG rep frente, continuando...', e);
                        }
                    }
                    
                    let arquivoRGRep1VersoUrl = null;
                    if (formData.arquivoRGRep1Verso) {
                        try {
                            arquivoRGRep1VersoUrl = await uploadFile(formData.arquivoRGRep1Verso, 'documentos');
                        } catch (e) {
                            console.warn('⚠️ Erro no upload RG rep verso, continuando...', e);
                        }
                    }
                    
                    let contratoSocialUrl = null;
                    if (formData.contratoSocial) {
                        try {
                            contratoSocialUrl = await uploadFile(formData.contratoSocial, 'documentos');
                        } catch (e) {
                            console.warn('⚠️ Erro no upload contrato social, continuando...', e);
                        }
                    }
                    
                    // QUARTO: Atualizar proposta com todos os dados
                    console.log('📝 Fase 3: Atualizando proposta com dados completos...');
                    
                    const propostaCompleta = {
                        cpf: formData.cpf || null,
                        rg: formData.rg || null,
                        cnpj: formData.cnpj || null,
                        nome_fantasia: formData.nomeFantasia || null,
                        razao_social: formData.razaoSocial || null,
                        representante_legal_1: formData.representanteLegal1 || null,
                        cpf_representante_1: formData.cpfRepresentante1 || null,
                        rg_representante_1: formData.rgRepresentante1 || null,
                        tem_responsavel_pagamento: formData.temResponsavelPagamento,
                        nome_responsavel_pagamento: formData.nomeResponsavelPagamento || null,
                        cpf_responsavel_pagamento: formData.cpfResponsavelPagamento || null,
                        rg_responsavel_pagamento: formData.rgResponsavelPagamento || null,
                        complemento: formData.complemento || null,
                        cupom_desconto: formData.cupom || null,
                        arquivo_conta_url: arquivoContaUrl,
                        arquivo_rg_frente_url: arquivoRGFrenteUrl,
                        arquivo_rg_verso_url: arquivoRGVersoUrl,
                        arquivo_rg_rep1_frente_url: arquivoRGRep1FrenteUrl,
                        arquivo_rg_rep1_verso_url: arquivoRGRep1VersoUrl,
                        contrato_social_url: contratoSocialUrl
                    };
                    
                    const responseUpdate = await fetch(`${SUPABASE_URL}/rest/v1/propostas?id=eq.${resultadoTeste[0].id}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(propostaCompleta)
                    });
                    
                    if (!responseUpdate.ok) {
                        const errorText = await responseUpdate.text();
                        console.error('⚠️ Erro ao atualizar com dados completos:', errorText);
                        // Não vamos falhar aqui, pois os dados básicos já foram salvos
                    }
                    
                    console.log('✅ PROPOSTA SALVA COM SUCESSO!');
                    setPropostaId(resultadoTeste[0].id);
                    setMostrarRevisao(true);
                    
                } catch (error) {
                    console.error('❌ ERRO GERAL:', error);
                    alert(error.message);
                } finally {
                    setLoading(false);
                }
            };

            if (mostrarRevisao) {
                const dataAtual = new Date().toLocaleDateString('pt-BR');
                
                return (
                    <div className="min-h-screen bg-gray-50 p-8">
                        <div className="max-w-6xl mx-auto bg-white rounded-lg shadow-lg">
                            {/* Cabeçalho com logo e sucesso */}
                            <div className="bg-gradient-to-r from-green-500 to-green-600 text-white p-8 rounded-t-lg">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <img src="https://uuaqmwnfjopgjmjjchmw.supabase.co/storage/v1/object/public/logos/Logo%20Oby%20-%20Baixa%20Qualidade.png" alt="OBY Energy" className="h-16 w-auto mb-4" style={{filter: 'brightness(0) invert(1)'}} />
                                        <h1 className="text-4xl font-bold mb-2">✓ Proposta Enviada com Sucesso!</h1>
                                        <p className="text-green-100">Protocolo: #{propostaId || 'Em processamento'} | Data: {dataAtual}</p>
                                    </div>
                                    <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center">
                                        <svg className="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                                        </svg>
                                    </div>
                                </div>
                            </div>

                            <div className="p-8">
                                {/* Cards de resumo de economia */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                    <div className="bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-lg border-2 border-green-300">
                                        <p className="text-sm text-gray-600 mb-2">💰 Economia Mensal</p>
                                        <p className="text-3xl font-bold text-green-600">R$ {formatBRL(simulacao.economiaMensal)}</p>
                                    </div>
                                    <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-lg border-2 border-blue-300">
                                        <p className="text-sm text-gray-600 mb-2">📊 Economia Anual</p>
                                        <p className="text-3xl font-bold text-blue-600">R$ {formatBRL(simulacao.economiaAnual)}</p>
                                    </div>
                                    <div className="bg-gradient-to-br from-purple-50 to-purple-100 p-6 rounded-lg border-2 border-purple-300">
                                        <p className="text-sm text-gray-600 mb-2">🎯 Desconto Aplicado</p>
                                        <p className="text-3xl font-bold text-purple-600">{simulacao.desconto}%</p>
                                    </div>
                                </div>

                                {/* Dados do Cliente */}
                                <div className="mb-8">
                                    <h2 className="text-2xl font-bold mb-4 pb-2 border-b-2 border-gray-200">📋 Dados do Cliente</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-6 rounded-lg">
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">Nome Completo</p>
                                            <p className="font-semibold text-lg">{formData.nome} {formData.sobrenome}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">E-mail</p>
                                            <p className="font-semibold">{formData.email}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">Telefone</p>
                                            <p className="font-semibold">{formData.telefone}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">CPF/CNPJ</p>
                                            <p className="font-semibold">{formData.tipoPessoa === 'fisica' ? formData.cpf : formData.cnpj}</p>
                                        </div>
                                        <div className="md:col-span-2">
                                            <p className="text-sm text-gray-500 mb-1">Endereço</p>
                                            <p className="font-semibold">
                                                {formData.logradouro}, {formData.numeroEndereco}
                                                {formData.complemento && ` - ${formData.complemento}`}
                                                <br />
                                                {formData.bairro} - {formData.cidade}/{formData.estado} - CEP: {formData.cep}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* Dados da Instalação */}
                                <div className="mb-8">
                                    <h2 className="text-2xl font-bold mb-4 pb-2 border-b-2 border-gray-200">⚡ Dados da Instalação</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-blue-50 p-6 rounded-lg">
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">Distribuidora</p>
                                            <p className="font-semibold">{formData.distribuidoraEnergia}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">Número da Instalação</p>
                                            <p className="font-semibold">{formData.numeroInstalacao}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">Tipo de Conexão</p>
                                            <p className="font-semibold capitalize">{formData.tipoConexao}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">Consumo Médio Mensal</p>
                                            <p className="font-semibold text-xl text-blue-600">{formatBRL(formData.consumoKW)} kWh</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 mb-1">Modalidade Tarifária</p>
                                            <p className="font-semibold">{formData.modalidadeTarifaria}</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Memória de Cálculo */}
                                <div className="mb-8">
                                    <h2 className="text-2xl font-bold mb-4 pb-2 border-b-2 border-gray-200">🧮 Memória de Cálculo</h2>
                                    <div className="bg-gradient-to-br from-gray-50 to-blue-50 p-6 rounded-lg border-2 border-blue-200">
                                        <div className="space-y-3">
                                            <div className="flex justify-between items-center py-3 border-b border-gray-300">
                                                <span className="text-gray-700">💡 Consumo Médio Mensal</span>
                                                <span className="font-bold text-lg">{formatBRL(formData.consumoKW)} kWh</span>
                                            </div>
                                            <div className="flex justify-between items-center py-3 border-b border-gray-300">
                                                <span className="text-gray-700">📊 Consumo Mínimo ({formData.tipoConexao})</span>
                                                <span className="font-semibold">{consumoMinimo[formData.tipoConexao]} kWh</span>
                                            </div>
                                            <div className="flex justify-between items-center py-3 border-b border-gray-300">
                                                <span className="text-gray-700">⚡ Tarifa Média (estimada)</span>
                                                <span className="font-semibold">R$ {formatBRL(simulacao.tarifaMedia)}/kWh</span>
                                            </div>
                                            <div className="flex justify-between items-center py-3 border-b border-gray-300 bg-red-50">
                                                <span className="text-gray-700 font-semibold">💰 Conta Atual (sem desconto)</span>
                                                <span className="font-bold text-lg text-red-600">R$ {formatBRL(simulacao.contaAtual)}</span>
                                            </div>
                                            <div className="flex justify-between items-center py-3 border-b border-gray-300 bg-green-50">
                                                <span className="text-gray-700 font-semibold">🎯 Desconto Aplicado</span>
                                                <span className="font-bold text-lg text-purple-600">{simulacao.desconto}%</span>
                                            </div>
                                            <div className="flex justify-between items-center py-3 border-b-2 border-green-400 bg-green-50">
                                                <span className="text-gray-700 font-semibold">✅ Conta com Oby Energy</span>
                                                <span className="font-bold text-lg text-green-600">R$ {formatBRL(simulacao.contaNova)}</span>
                                            </div>
                                            
                                            {/* Resultado Final */}
                                            <div className="mt-6 pt-6 border-t-2 border-gray-300">
                                                <div className="flex justify-between items-center py-3 bg-gradient-to-r from-green-100 to-blue-100 px-4 rounded-lg mb-2">
                                                    <span className="text-lg font-bold text-gray-800">💵 Economia Mensal</span>
                                                    <span className="font-bold text-2xl text-green-600">R$ {formatBRL(simulacao.economiaMensal)}</span>
                                                </div>
                                                <div className="flex justify-between items-center py-3 bg-gradient-to-r from-blue-100 to-purple-100 px-4 rounded-lg">
                                                    <span className="text-lg font-bold text-gray-800">📈 Economia Anual (12 meses)</span>
                                                    <span className="font-bold text-2xl text-blue-600">R$ {formatBRL(simulacao.economiaAnual)}</span>
                                                </div>
                                            </div>

                                            {/* Observações */}
                                            <div className="mt-6 p-4 bg-yellow-50 border-l-4 border-yellow-400 rounded">
                                                <p className="text-sm text-gray-700">
                                                    <strong>⚠️ Observação:</strong> Os valores apresentados são estimativas baseadas no consumo informado e na tarifa média da distribuidora. 
                                                    Os valores finais podem variar de acordo com as bandeiras tarifárias, impostos e taxas aplicáveis em cada período de faturamento.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Próximos Passos */}
                                <div className="mb-8">
                                    <h2 className="text-2xl font-bold mb-4 pb-2 border-b-2 border-gray-200">📌 Próximos Passos</h2>
                                    <div className="bg-blue-50 p-6 rounded-lg">
                                        <ol className="list-decimal list-inside space-y-2 text-gray-700">
                                            <li className="font-semibold">Nossa equipe irá analisar sua proposta em até 24 horas úteis</li>
                                            <li>Você receberá um e-mail de confirmação com os detalhes do contrato</li>
                                            <li>Após a aprovação, enviaremos o termo de adesão para assinatura digital</li>
                                            <li>Em caso de dúvidas, entre em contato através do e-mail: <strong>contato@obyenergy.com.br</strong></li>
                                        </ol>
                                    </div>
                                </div>

                                {/* Botões de ação */}
                                <div className="flex gap-4 justify-center no-print pt-6 border-t-2">
                                    <button onClick={() => window.print()} className="px-8 py-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 font-semibold text-lg shadow-lg">
                                        🖨️ Imprimir Proposta
                                    </button>
                                    <button onClick={() => window.location.reload()} className="px-8 py-4 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 font-semibold text-lg shadow-lg">
                                        ➕ Nova Proposta
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-green-50 p-4">
                    <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
                        <div className="text-center mb-8">
                            <div className="flex justify-center mb-4">
                                <img src="https://uuaqmwnfjopgjmjjchmw.supabase.co/storage/v1/object/public/logos/Logo%20Oby%20-%20Baixa%20Qualidade.png" alt="OBY Energy" className="h-20 w-auto" />
                            </div>
                            <h2 className="text-xl text-gray-600">Energia Renovável com Desconto</h2>
                        </div>

                        <div className="flex justify-between items-center mb-8">
                            {[1, 2, 3, 4, 5].map((s) => (
                                <div key={s} className="flex items-center flex-1">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold ${s <= step ? 'bg-blue-600 text-white' : 'bg-gray-300 text-gray-600'}`}>{s}</div>
                                    {s < 5 && <div className={`flex-1 h-1 mx-2 ${s < step ? 'bg-blue-600' : 'bg-gray-300'}`} />}
                                </div>
                            ))}
                        </div>

                        {step === 1 && (
                            <div className="space-y-6">
                                <div className="bg-blue-50 p-4 rounded-lg">
                                    <p className="text-sm text-blue-800">⚡ 100% Renovável | Sem obras | Desconto de {formData.cupom ? '20%' : '15%'}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">CEP *</label>
                                    <input type="text" name="cep" value={formData.cep} onChange={handleInputChange} onBlur={validateCEP} placeholder="00000-000" className={`w-full p-3 border rounded-lg ${errors.cep ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.cep && <p className="text-red-500 text-sm mt-1">{errors.cep}</p>}
                                    {cepValidado && !errors.cep && !estadoForaCobertura && <p className="text-green-600 text-sm mt-1">✓ Disponibilidade confirmada!</p>}
                                    {estadoForaCobertura && (
                                        <div className="bg-yellow-50 border border-yellow-400 p-3 rounded-lg mt-2">
                                            <p className="text-yellow-800 text-sm font-medium">⚠️ Atenção</p>
                                            <p className="text-yellow-700 text-sm mt-1">Atualmente só temos energia disponível para o Paraná.</p>
                                        </div>
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium mb-2">Nome *</label>
                                        <input type="text" name="nome" value={formData.nome} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.nome ? 'border-red-500' : 'border-gray-300'}`} />
                                        {errors.nome && <p className="text-red-500 text-sm mt-1">{errors.nome}</p>}
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-2">Sobrenome *</label>
                                        <input type="text" name="sobrenome" value={formData.sobrenome} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.sobrenome ? 'border-red-500' : 'border-gray-300'}`} />
                                        {errors.sobrenome && <p className="text-red-500 text-sm mt-1">{errors.sobrenome}</p>}
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Email *</label>
                                    <input type="email" name="email" value={formData.email} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.email ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.email && <p className="text-red-500 text-sm mt-1">{errors.email}</p>}
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Telefone *</label>
                                    <input type="tel" name="telefone" value={formData.telefone} onChange={handleInputChange} placeholder="(00) 00000-0000" className={`w-full p-3 border rounded-lg ${errors.telefone ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.telefone && <p className="text-red-500 text-sm mt-1">{errors.telefone}</p>}
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Cupom (opcional)</label>
                                    <input type="text" name="cupom" value={formData.cupom} onChange={handleInputChange} className="w-full p-3 border rounded-lg border-gray-300" />
                                    {formData.cupom && <p className="text-green-600 text-sm mt-1">✓ Desconto de 20%!</p>}
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6">
                                <div className="bg-indigo-50 p-4 rounded-lg mb-4">
                                    <p className="text-sm text-indigo-800">📍 Endereço do Cliente</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Logradouro *</label>
                                    <input type="text" name="logradouro" value={formData.logradouro} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.logradouro ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.logradouro && <p className="text-red-500 text-sm mt-1">{errors.logradouro}</p>}
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium mb-2">Número *</label>
                                        <input type="text" name="numeroEndereco" value={formData.numeroEndereco} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.numeroEndereco ? 'border-red-500' : 'border-gray-300'}`} />
                                        {errors.numeroEndereco && <p className="text-red-500 text-sm mt-1">{errors.numeroEndereco}</p>}
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-2">Complemento</label>
                                        <input type="text" name="complemento" value={formData.complemento} onChange={handleInputChange} className="w-full p-3 border rounded-lg border-gray-300" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Bairro *</label>
                                    <input type="text" name="bairro" value={formData.bairro} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.bairro ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.bairro && <p className="text-red-500 text-sm mt-1">{errors.bairro}</p>}
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium mb-2">Cidade</label>
                                        <input type="text" name="cidade" value={formData.cidade} readOnly className="w-full p-3 border rounded-lg border-gray-300 bg-gray-100" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-2">Estado</label>
                                        <input type="text" name="estado" value={formData.estado} readOnly className="w-full p-3 border rounded-lg border-gray-300 bg-gray-100" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6">
                                <div className="bg-green-50 p-4 rounded-lg mb-4">
                                    <p className="text-sm text-green-800">⚡ Qualificação da Instalação</p>
                                </div>
                                <div className="bg-blue-50 border-2 border-blue-300 rounded-xl p-6 mb-6">
                                    <h3 className="text-lg font-bold text-blue-800 mb-4">
                                        <span className="text-2xl mr-2">📄</span>
                                        Como encontrar essas informações na sua conta da COPEL
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <img src="https://uuaqmwnfjopgjmjjchmw.supabase.co/storage/v1/object/public/Demos/guia-copel-1.png" alt="Guia" className="w-full rounded-lg" />
                                        <img src="https://uuaqmwnfjopgjmjjchmw.supabase.co/storage/v1/object/public/Demos/guia-copel-2.png" alt="Guia" className="w-full rounded-lg" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Modalidade Tarifária *</label>
                                    <select name="modalidadeTarifaria" value={formData.modalidadeTarifaria} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.modalidadeTarifaria ? 'border-red-500' : 'border-gray-300'}`}>
                                        <option value="">Selecione...</option>
                                        <option value="Convencional">Convencional</option>
                                        <option value="Branca">Branca</option>
                                        <option value="Azul">Azul</option>
                                        <option value="Verde">Verde</option>
                                    </select>
                                    {errors.modalidadeTarifaria && <p className="text-red-500 text-sm mt-1">{errors.modalidadeTarifaria}</p>}
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Distribuidora *</label>
                                    <input type="text" name="distribuidoraEnergia" value={formData.distribuidoraEnergia} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.distribuidoraEnergia ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.distribuidoraEnergia && <p className="text-red-500 text-sm mt-1">{errors.distribuidoraEnergia}</p>}
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Tipo de Conexão *</label>
                                    <div className="grid grid-cols-3 gap-4">
                                        {['trifasico', 'bifasico', 'monofasico'].map((tipo) => (
                                            <button key={tipo} type="button" onClick={() => setFormData(prev => ({ ...prev, tipoConexao: tipo }))} className={`p-4 rounded-lg border-2 ${formData.tipoConexao === tipo ? 'border-blue-600 bg-blue-50' : 'border-gray-300'}`}>
                                                {tipo.charAt(0).toUpperCase() + tipo.slice(1)}
                                                <div className="text-xs text-gray-600 mt-1">Mín: {consumoMinimo[tipo]} kW</div>
                                            </button>
                                        ))}
                                    </div>
                                    {errors.tipoConexao && <p className="text-red-500 text-sm mt-1">{errors.tipoConexao}</p>}
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Consumo Mensal (kW) *</label>
                                    <input type="number" name="consumoKW" value={formData.consumoKW} onChange={handleInputChange} placeholder="Ex: 250" className={`w-full p-3 border rounded-lg ${errors.consumoKW ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.consumoKW && <p className="text-red-500 text-sm mt-1">{errors.consumoKW}</p>}
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Número da Instalação *</label>
                                    <input type="text" name="numeroInstalacao" value={formData.numeroInstalacao} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.numeroInstalacao ? 'border-red-500' : 'border-gray-300'}`} />
                                    {errors.numeroInstalacao && <p className="text-red-500 text-sm mt-1">{errors.numeroInstalacao}</p>}
                                </div>
                            </div>
                        )}

                        {step === 4 && simulacao && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-green-500 to-blue-600 text-white p-8 rounded-xl text-center">
                                    <h3 className="text-xl font-semibold mb-3">Sua Economia Mensal com Energia</h3>
                                    <p className="text-6xl font-bold mb-3">R$ {formatBRL(simulacao.economiaMensal)}</p>
                                    <p className="text-lg">Desconto de até {simulacao.desconto}% *</p>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4 p-4 border-2 border-red-500 rounded-lg">
                                            <div>
                                                <h4 className="text-center font-bold text-blue-800 mb-3">Conta Atual</h4>
                                                <div className="space-y-1 text-xs">
                                                    <div className="flex justify-between">
                                                        <span>Consumo Mínimo</span>
                                                        <span>R$ {formatBRL(simulacao.consumoMinimoValor)}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>Impostos Não Compensáveis</span>
                                                        <span>R$ {formatBRL(simulacao.impostosNaoCompensaveis)}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>Energia Cativa</span>
                                                        <span>R$ {formatBRL(simulacao.energiaCativaAtual)}</span>
                                                    </div>
                                                    <div className="border-t pt-1 flex justify-between font-bold">
                                                        <span>Total</span>
                                                        <span>R$ {formatBRL(simulacao.contaAtual)}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <h4 className="text-center font-bold text-green-800 mb-3">Com a Oby</h4>
                                                <div className="space-y-1 text-xs">
                                                    <div className="flex justify-between">
                                                        <span>Consumo Mínimo</span>
                                                        <span>R$ {formatBRL(simulacao.consumoMinimoValor)}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>Impostos Não Compensáveis</span>
                                                        <span>R$ {formatBRL(simulacao.impostosNaoCompensaveis)}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>Energia Cativa</span>
                                                        <span>R$ {formatBRL(simulacao.energiaCativaComDesconto)}</span>
                                                    </div>
                                                    <div className="border-t pt-1 flex justify-between font-bold text-green-700">
                                                        <span>Total</span>
                                                        <span>R$ {formatBRL(simulacao.contaNova)}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-4">
                                            <h4 className="font-semibold text-blue-800 mb-3">Seu desconto conosco:</h4>
                                            <div className="space-y-1 text-sm">
                                                <div className="flex justify-between">
                                                    <span>Consumo Mínimo</span>
                                                    <span>R$ {formatBRL(simulacao.consumoMinimoValor)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Impostos Não Compensáveis</span>
                                                    <span>R$ {formatBRL(simulacao.impostosNaoCompensaveis)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Energia Cativa</span>
                                                    <span>R$ {formatBRL(simulacao.energiaCativaAtual)}</span>
                                                </div>
                                                <div className="border-t my-1"></div>
                                                <div className="flex justify-between font-semibold">
                                                    <span></span>
                                                    <span>R$ {formatBRL(simulacao.contaAtual)}</span>
                                                </div>
                                                <div className="flex justify-between text-green-600 font-bold">
                                                    <span>Desconto Oby na Energia (-{simulacao.desconto}%)</span>
                                                    <span>(R$ {formatBRL(simulacao.economiaMensal)})</span>
                                                </div>
                                                <div className="border-t-2 pt-1 flex justify-between font-bold text-green-700">
                                                    <span></span>
                                                    <span>R$ {formatBRL(simulacao.contaNova)}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-green-100 p-4 rounded-lg border-2 border-green-400 text-center">
                                            <p className="text-green-800 font-bold">
                                                Sua economia equivale a pagar somente<br/>
                                                <span className="text-2xl">{simulacao.contasPorAno} contas ao ano</span>
                                            </p>
                                        </div>

                                        <div className="bg-yellow-50 border border-yellow-400 rounded-lg p-3">
                                            <p className="text-xs text-yellow-800">* Desconto varia conforme tipo de conexão e bandeiras tarifárias</p>
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-lg border-2 border-gray-300">
                                        <h3 className="text-xl font-bold mb-4 text-center border-b pb-3">Dados de Entrada do Cadastro</h3>
                                        <div className="mb-4">
                                            <h4 className="font-bold mb-2">Base do Consumo Mínimo:</h4>
                                            <table className="w-full text-sm">
                                                <thead>
                                                    <tr className="border-b">
                                                        <th className="text-left py-2">Conexão</th>
                                                        <th className="text-right py-2">Consumo Mínimo kWh</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td>Monofásica</td>
                                                        <td className="text-right">30</td>
                                                    </tr>
                                                    <tr>
                                                        <td>Bifásica</td>
                                                        <td className="text-right">50</td>
                                                    </tr>
                                                    <tr className={formData.tipoConexao === 'trifasico' ? 'bg-blue-100' : ''}>
                                                        <td className="font-bold">Trifásica</td>
                                                        <td className="text-right font-bold">100</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div className="bg-blue-50 p-4 rounded-lg border border-blue-200 mb-4">
                                            <p className="text-center font-bold text-blue-800">
                                                Consumo Médio Mensal:<br/>
                                                <span className="text-2xl">{simulacao.consumoKW} kWh</span>
                                            </p>
                                        </div>
                                        <div className="bg-gradient-to-r from-blue-50 to-green-50 p-4 rounded-lg border">
                                            <h4 className="font-semibold text-center mb-3 text-blue-800">📊 Resumo da Economia</h4>
                                            <div className="space-y-2 text-sm">
                                                <div className="flex justify-between">
                                                    <span>Economia Mensal:</span>
                                                    <span className="font-bold text-green-600">R$ {formatBRL(simulacao.economiaMensal)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Economia Anual:</span>
                                                    <span className="font-bold text-green-600">R$ {formatBRL(simulacao.economiaAnual)}</span>
                                                </div>
                                                <div className="flex justify-between border-t pt-2">
                                                    <span>Tipo de Conexão:</span>
                                                    <span className="font-bold capitalize">{simulacao.tipoConexao}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Desconto Aplicado:</span>
                                                    <span className="font-bold text-blue-600">{simulacao.desconto}%</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 5 && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    <button onClick={() => setFormData(prev => ({ ...prev, tipoPessoa: 'fisica' }))} className={`p-6 rounded-lg border-2 ${formData.tipoPessoa === 'fisica' ? 'border-blue-600 bg-blue-50' : 'border-gray-300'}`}>
                                        Pessoa Física
                                    </button>
                                    <button onClick={() => setFormData(prev => ({ ...prev, tipoPessoa: 'juridica' }))} className={`p-6 rounded-lg border-2 ${formData.tipoPessoa === 'juridica' ? 'border-blue-600 bg-blue-50' : 'border-gray-300'}`}>
                                        Pessoa Jurídica
                                    </button>
                                </div>

                                {formData.tipoPessoa === 'fisica' ? (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">CPF *</label>
                                            <input type="text" name="cpf" value={formData.cpf} onChange={handleInputChange} placeholder="000.000.000-00" className={`w-full p-3 border rounded-lg ${errors.cpf ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.cpf && <p className="text-red-500 text-sm mt-1">{errors.cpf}</p>}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">RG *</label>
                                            <input type="text" name="rg" value={formData.rg} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.rg ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.rg && <p className="text-red-500 text-sm mt-1">{errors.rg}</p>}
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium mb-2">RG/CNH Frente *</label>
                                                <input type="file" name="arquivoRGFrente" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGFrente ? 'border-red-500' : 'border-gray-300'}`} />
                                                {formData.arquivoRGFrente && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGFrente.name}</p>}
                                                {errors.arquivoRGFrente && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGFrente}</p>}
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium mb-2">RG/CNH Verso *</label>
                                                <input type="file" name="arquivoRGVerso" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGVerso ? 'border-red-500' : 'border-gray-300'}`} />
                                                {formData.arquivoRGVerso && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGVerso.name}</p>}
                                                {errors.arquivoRGVerso && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGVerso}</p>}
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">CNPJ *</label>
                                            <input type="text" name="cnpj" value={formData.cnpj} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.cnpj ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.cnpj && <p className="text-red-500 text-sm mt-1">{errors.cnpj}</p>}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Nome Fantasia *</label>
                                            <input type="text" name="nomeFantasia" value={formData.nomeFantasia} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.nomeFantasia ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.nomeFantasia && <p className="text-red-500 text-sm mt-1">{errors.nomeFantasia}</p>}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Razão Social *</label>
                                            <input type="text" name="razaoSocial" value={formData.razaoSocial} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.razaoSocial ? 'border-red-500' : 'border-gray-300'}`} />
                                            {errors.razaoSocial && <p className="text-red-500 text-sm mt-1">{errors.razaoSocial}</p>}
                                        </div>
                                        <div className="border-t pt-4">
                                            <h3 className="font-bold mb-4">Representante Legal 1 *</h3>
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">Nome Completo *</label>
                                                    <input type="text" name="representanteLegal1" value={formData.representanteLegal1} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.representanteLegal1 ? 'border-red-500' : 'border-gray-300'}`} />
                                                    {errors.representanteLegal1 && <p className="text-red-500 text-sm mt-1">{errors.representanteLegal1}</p>}
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">CPF *</label>
                                                        <input type="text" name="cpfRepresentante1" value={formData.cpfRepresentante1} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.cpfRepresentante1 ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {errors.cpfRepresentante1 && <p className="text-red-500 text-sm mt-1">{errors.cpfRepresentante1}</p>}
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">RG *</label>
                                                        <input type="text" name="rgRepresentante1" value={formData.rgRepresentante1} onChange={handleInputChange} className={`w-full p-3 border rounded-lg ${errors.rgRepresentante1 ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {errors.rgRepresentante1 && <p className="text-red-500 text-sm mt-1">{errors.rgRepresentante1}</p>}
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">RG Frente *</label>
                                                        <input type="file" name="arquivoRGRep1Frente" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGRep1Frente ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {formData.arquivoRGRep1Frente && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRep1Frente.name}</p>}
                                                        {errors.arquivoRGRep1Frente && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRep1Frente}</p>}
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium mb-2">RG Verso *</label>
                                                        <input type="file" name="arquivoRGRep1Verso" onChange={handleFileChange} accept=".pdf,.jpg,.jpeg,.png" className={`w-full p-3 border rounded-lg ${errors.arquivoRGRep1Verso ? 'border-red-500' : 'border-gray-300'}`} />
                                                        {formData.arquivoRGRep1Verso && <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRep1Verso.name}</p>}
                                                        {errors.arquivoRGRep1Verso && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRep1Verso}</p>}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Contrato Social *</label>
                                            <input type="file" name="contratoSocial" onChange={handleFileChange} accept=".pdf" className={`w-full p-3 border rounded-lg ${errors.contratoSocial ? 'border-red-500' : 'border-gray-300'}`} />
                                            {formData.contratoSocial && <p className="text-green-600 text-sm mt-1">✓ {formData.contratoSocial.name}</p>}
                                            {errors.contratoSocial && <p className="text-red-500 text-sm mt-1">{errors.contratoSocial}</p>}
                                        </div>
                                    </>
                                )}

                                <div className="border-t pt-6">
                                    <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-400 mb-4">
                                        <label className="flex items-center cursor-pointer">

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBY Energy - Contratação</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://uuaqmwnfjopgjmjjchmw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YXFtd25mam9wZ2ptampjaG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTEyNzUsImV4cCI6MjA3NjE2NzI3NX0.9ITSBR9SNoZKgvF1AuW4OsL4b8Du5NAXttQpi7B3MO8';

        function EnergyContractForm() {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [mostrarMinuta, setMostrarMinuta] = useState(false);
            const [mostrarRevisao, setMostrarRevisao] = useState(false);
            const [propostaId, setPropostaId] = useState(null);
            const [formData, setFormData] = useState({
                cep: '', nome: '', sobrenome: '', cupom: '', 
                email: '', telefone: '', valorMedioConta: '',
                logradouro: '', numeroEndereco: '', complemento: '', bairro: '',
                estado: '', cidade: '',
                modalidadeTarifaria: '', distribuidoraEnergia: 'COPEL',
                logradouroInstalacao: '', numeroInstalacaoEndereco: '',
                complementoInstalacao: '', bairroInstalacao: '',
                cidadeInstalacao: '', estadoInstalacao: '',
                arquivoConta: null, tipoConexao: '', consumoKW: '', 
                numeroInstalacao: '', numeroCliente: '',
                tipoPessoa: 'fisica', cpf: '', rg: '', 
                arquivoRGFrente: null, arquivoRGVerso: null,
                cnpj: '', nomeFantasia: '', razaoSocial: '',
                representanteLegal1: '', cpfRepresentante1: '', rgRepresentante1: '', 
                arquivoRGRep1Frente: null, arquivoRGRep1Verso: null,
                representanteLegal2: '', cpfRepresentante2: '', rgRepresentante2: '', 
                arquivoRGRep2Frente: null, arquivoRGRep2Verso: null,
                copiarDadosContato: false,
                tipoDocumentoEmpresa: 'contrato', contratoSocial: null,
                temResponsavelPagamento: false,
                nomeResponsavelPagamento: '', cpfResponsavelPagamento: '',
                rgResponsavelPagamento: '',
                arquivoRGRespPagFrente: null, arquivoRGRespPagVerso: null,
                aceiteTermoAdesao: false, aceiteDadosPessoais: false
            });
            const [errors, setErrors] = useState({});
            const [simulacao, setSimulacao] = useState(null);
            const [cepValidado, setCepValidado] = useState(false);
            const [estadoForaCobertura, setEstadoForaCobertura] = useState(false);

            const consumoMinimo = { trifasico: 100, bifasico: 50, monofasico: 30 };

            // ✅ NOVO: Carregar propostaId do localStorage ao iniciar
            useEffect(() => {
                const savedPropostaId = localStorage.getItem('oby_proposta_id');
                if (savedPropostaId) {
                    setPropostaId(savedPropostaId);
                    console.log('📂 Proposta em andamento carregada:', savedPropostaId);
                }
            }, []);

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
                if (errors[name]) setErrors(prev => ({ ...prev, [name]: '' }));
            };

            const handleFileChange = (e) => {
                const { name, files } = e.target;
                if (files && files[0]) {
                    setFormData(prev => ({ ...prev, [name]: files[0] }));
                    if (errors[name]) setErrors(prev => ({ ...prev, [name]: '' }));
                }
            };

            const validateCEP = async () => {
                const cepRegex = /^\d{5}-?\d{3}$/;
                if (!cepRegex.test(formData.cep)) {
                    setErrors(prev => ({ ...prev, cep: 'CEP inválido' }));
                    return false;
                }
                
                try {
                    const cepLimpo = formData.cep.replace('-', '');
                    const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const data = await response.json();
                    
                    if (data.erro) {
                        setErrors(prev => ({ ...prev, cep: 'CEP não encontrado' }));
                        return false;
                    }
                    
                    setFormData(prev => ({ 
                        ...prev, 
                        estado: data.uf, 
                        cidade: data.localidade,
                        logradouro: data.logradouro || '',
                        bairro: data.bairro || '',
                        complemento: data.complemento || ''
                    }));
                    
                    if (data.uf !== 'PR') {
                        setEstadoForaCobertura(true);
                        return false;
                    }
                    
                    setCepValidado(true);
                    return true;
                } catch (error) {
                    console.error('Erro ao buscar CEP:', error);
                    setErrors(prev => ({ ...prev, cep: 'Erro ao buscar CEP' }));
                    return false;
                }
            };

            const calcularSimulacao = () => {
                const consumo = parseFloat(formData.consumoKW);
                const tarifa = 0.75;
                const desconto = formData.cupom.toUpperCase() === 'OBYVIP' ? 10 : 3;
                
                const economiaAnual = consumo * 12 * tarifa * (desconto / 100);
                const economiaMensal = economiaAnual / 12;
                
                setSimulacao({ economiaMensal, economiaAnual, desconto });
            };

            // ✅ NOVA FUNÇÃO: Upload de arquivo para Supabase Storage
            const uploadArquivo = async (arquivo, pasta, nomeArquivo) => {
                if (!arquivo) return null;
                
                try {
                    const formData = new FormData();
                    formData.append('file', arquivo);
                    
                    const caminho = `${pasta}/${nomeArquivo}`;
                    
                    const response = await fetch(`${SUPABASE_URL}/storage/v1/object/propostas/${caminho}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        },
                        body: formData
                    });

                    if (!response.ok) {
                        console.error('Erro ao fazer upload:', await response.text());
                        return null;
                    }

                    const publicURL = `${SUPABASE_URL}/storage/v1/object/public/propostas/${caminho}`;
                    console.log('✅ Arquivo enviado:', publicURL);
                    return publicURL;
                } catch (error) {
                    console.error('Erro no upload:', error);
                    return null;
                }
            };

            // ✅ NOVA FUNÇÃO: Salvar etapa no banco de dados
            const salvarEtapa = async (stepAtual) => {
                console.log(`\n🔵 ============ SALVANDO ETAPA ${stepAtual} ============`);
                setLoading(true);

                try {
                    let dadosParaSalvar = {
                        status: 'em_andamento',
                        updated_at: new Date().toISOString()
                    };

                    // Preparar dados de acordo com cada etapa
                    switch(stepAtual) {
                        case 1: // Tipo de Pessoa
                            dadosParaSalvar = {
                                ...dadosParaSalvar,
                                tipo_pessoa: formData.tipoPessoa
                            };
                            console.log('📝 Dados da Etapa 1:', dadosParaSalvar);
                            break;

                        case 2: // Dados Cadastrais
                            if (formData.tipoPessoa === 'fisica') {
                                dadosParaSalvar = {
                                    ...dadosParaSalvar,
                                    nome: formData.nome,
                                    sobrenome: formData.sobrenome,
                                    cpf: formData.cpf,
                                    rg: formData.rg,
                                    email: formData.email,
                                    telefone: formData.telefone
                                };
                            } else {
                                dadosParaSalvar = {
                                    ...dadosParaSalvar,
                                    razao_social: formData.razaoSocial,
                                    nome_fantasia: formData.nomeFantasia,
                                    cnpj: formData.cnpj,
                                    representante_legal_1: formData.representanteLegal1,
                                    cpf_representante_1: formData.cpfRepresentante1,
                                    rg_representante_1: formData.rgRepresentante1,
                                    email: formData.email,
                                    telefone: formData.telefone
                                };
                            }
                            console.log('📝 Dados da Etapa 2:', dadosParaSalvar);
                            break;

                        case 3: // Endereço
                            dadosParaSalvar = {
                                ...dadosParaSalvar,
                                cep: formData.cep,
                                logradouro: formData.logradouro,
                                numero_endereco: formData.numeroEndereco,
                                complemento: formData.complemento,
                                bairro: formData.bairro,
                                cidade: formData.cidade,
                                estado: formData.estado,
                                logradouro_instalacao: formData.logradouroInstalacao || formData.logradouro,
                                numero_instalacao_endereco: formData.numeroInstalacaoEndereco || formData.numeroEndereco,
                                complemento_instalacao: formData.complementoInstalacao || formData.complemento,
                                bairro_instalacao: formData.bairroInstalacao || formData.bairro,
                                cidade_instalacao: formData.cidadeInstalacao || formData.cidade,
                                estado_instalacao: formData.estadoInstalacao || formData.estado
                            };
                            console.log('📝 Dados da Etapa 3:', dadosParaSalvar);
                            break;

                        case 4: // Dados de Energia
                            dadosParaSalvar = {
                                ...dadosParaSalvar,
                                distribuidora_energia: formData.distribuidoraEnergia,
                                numero_instalacao: formData.numeroInstalacao,
                                numero_cliente: formData.numeroCliente,
                                tipo_conexao: formData.tipoConexao,
                                modalidade_tarifaria: formData.modalidadeTarifaria,
                                consumo_kw: parseInt(formData.consumoKW),
                                economia_mensal: simulacao?.economiaMensal || 0,
                                economia_anual: simulacao?.economiaAnual || 0,
                                desconto: simulacao?.desconto || 0,
                                cupom: formData.cupom
                            };
                            console.log('📝 Dados da Etapa 4:', dadosParaSalvar);
                            break;

                        case 5: // Documentos e Termos
                            // Upload de arquivos
                            const timestamp = Date.now();
                            let urlContaEnergia = null;
                            let urlRGFrente = null;
                            let urlRGVerso = null;
                            let urlContratoSocial = null;
                            let urlRGRep1Frente = null;
                            let urlRGRep1Verso = null;

                            if (formData.arquivoConta) {
                                urlContaEnergia = await uploadArquivo(
                                    formData.arquivoConta, 
                                    propostaId, 
                                    `conta-energia-${timestamp}.pdf`
                                );
                            }

                            if (formData.tipoPessoa === 'fisica') {
                                if (formData.arquivoRGFrente) {
                                    urlRGFrente = await uploadArquivo(
                                        formData.arquivoRGFrente, 
                                        propostaId, 
                                        `rg-frente-${timestamp}.${formData.arquivoRGFrente.name.split('.').pop()}`
                                    );
                                }
                                if (formData.arquivoRGVerso) {
                                    urlRGVerso = await uploadArquivo(
                                        formData.arquivoRGVerso, 
                                        propostaId, 
                                        `rg-verso-${timestamp}.${formData.arquivoRGVerso.name.split('.').pop()}`
                                    );
                                }
                            } else {
                                if (formData.contratoSocial) {
                                    urlContratoSocial = await uploadArquivo(
                                        formData.contratoSocial, 
                                        propostaId, 
                                        `contrato-social-${timestamp}.pdf`
                                    );
                                }
                                if (formData.arquivoRGRep1Frente) {
                                    urlRGRep1Frente = await uploadArquivo(
                                        formData.arquivoRGRep1Frente, 
                                        propostaId, 
                                        `rg-rep1-frente-${timestamp}.${formData.arquivoRGRep1Frente.name.split('.').pop()}`
                                    );
                                }
                                if (formData.arquivoRGRep1Verso) {
                                    urlRGRep1Verso = await uploadArquivo(
                                        formData.arquivoRGRep1Verso, 
                                        propostaId, 
                                        `rg-rep1-verso-${timestamp}.${formData.arquivoRGRep1Verso.name.split('.').pop()}`
                                    );
                                }
                            }

                            dadosParaSalvar = {
                                ...dadosParaSalvar,
                                url_conta_energia: urlContaEnergia,
                                url_rg_frente: urlRGFrente,
                                url_rg_verso: urlRGVerso,
                                url_contrato_social: urlContratoSocial,
                                url_rg_rep_1_frente: urlRGRep1Frente,
                                url_rg_rep_1_verso: urlRGRep1Verso,
                                aceite_termo_adesao: formData.aceiteTermoAdesao,
                                aceite_dados_pessoais: formData.aceiteDadosPessoais,
                                status: 'completo'
                            };
                            console.log('📝 Dados da Etapa 5:', dadosParaSalvar);
                            break;
                    }

                    // Determinar se é INSERT ou UPDATE
                    if (!propostaId) {
                        // ✅ ETAPA 1: INSERT - Criar novo registro
                        console.log('🆕 Criando NOVA proposta...');
                        
                        const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Prefer': 'return=representation'
                            },
                            body: JSON.stringify(dadosParaSalvar)
                        });

                        if (!response.ok) {
                            const errorText = await response.text();
                            console.error('❌ Erro ao criar proposta:', errorText);
                            throw new Error(`Erro ao criar proposta: ${errorText}`);
                        }

                        const result = await response.json();
                        const novoId = result[0].id;
                        
                        setPropostaId(novoId);
                        localStorage.setItem('oby_proposta_id', novoId);
                        
                        console.log('✅ Proposta CRIADA com sucesso! ID:', novoId);
                        console.log('💾 ID salvo no localStorage');
                        
                    } else {
                        // ✅ ETAPAS 2-5: UPDATE - Atualizar registro existente
                        console.log(`🔄 Atualizando proposta existente: ${propostaId}`);
                        
                        const response = await fetch(`${SUPABASE_URL}/rest/v1/propostas?id=eq.${propostaId}`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Prefer': 'return=representation'
                            },
                            body: JSON.stringify(dadosParaSalvar)
                        });

                        if (!response.ok) {
                            const errorText = await response.text();
                            console.error('❌ Erro ao atualizar proposta:', errorText);
                            throw new Error(`Erro ao atualizar proposta: ${errorText}`);
                        }

                        console.log('✅ Proposta ATUALIZADA com sucesso!');
                    }

                    console.log(`✅ ============ ETAPA ${stepAtual} SALVA! ============\n`);
                    return true;

                } catch (error) {
                    console.error('❌ Erro ao salvar etapa:', error);
                    alert('Erro ao salvar dados. Por favor, tente novamente.');
                    return false;
                } finally {
                    setLoading(false);
                }
            };

            const validateStep = () => {
                const newErrors = {};
                
                switch(step) {
                    case 1:
                        if (!formData.tipoPessoa) {
                            newErrors.tipoPessoa = 'Selecione o tipo de pessoa';
                        }
                        break;
                        
                    case 2:
                        if (formData.tipoPessoa === 'fisica') {
                            if (!formData.nome) newErrors.nome = 'Nome é obrigatório';
                            if (!formData.sobrenome) newErrors.sobrenome = 'Sobrenome é obrigatório';
                            if (!formData.cpf) newErrors.cpf = 'CPF é obrigatório';
                            if (!formData.rg) newErrors.rg = 'RG é obrigatório';
                        } else {
                            if (!formData.razaoSocial) newErrors.razaoSocial = 'Razão Social é obrigatória';
                            if (!formData.cnpj) newErrors.cnpj = 'CNPJ é obrigatório';
                            if (!formData.representanteLegal1) newErrors.representanteLegal1 = 'Representante Legal é obrigatório';
                            if (!formData.cpfRepresentante1) newErrors.cpfRepresentante1 = 'CPF do Representante é obrigatório';
                            if (!formData.rgRepresentante1) newErrors.rgRepresentante1 = 'RG do Representante é obrigatório';
                        }
                        if (!formData.email) newErrors.email = 'E-mail é obrigatório';
                        if (!formData.telefone) newErrors.telefone = 'Telefone é obrigatório';
                        break;
                        
                    case 3:
                        if (!cepValidado) {
                            newErrors.cep = 'Valide o CEP antes de prosseguir';
                        }
                        if (!formData.numeroEndereco) newErrors.numeroEndereco = 'Número é obrigatório';
                        break;
                        
                    case 4:
                        if (!formData.numeroInstalacao) newErrors.numeroInstalacao = 'Número de instalação é obrigatório';
                        if (!formData.numeroCliente) newErrors.numeroCliente = 'Número do cliente é obrigatório';
                        if (!formData.tipoConexao) newErrors.tipoConexao = 'Tipo de conexão é obrigatório';
                        if (!formData.modalidadeTarifaria) newErrors.modalidadeTarifaria = 'Modalidade tarifária é obrigatória';
                        if (!formData.consumoKW) newErrors.consumoKW = 'Consumo é obrigatório';
                        
                        if (formData.tipoConexao && formData.consumoKW) {
                            const consumo = parseFloat(formData.consumoKW);
                            const minimo = consumoMinimo[formData.tipoConexao];
                            if (consumo < minimo) {
                                newErrors.consumoKW = `Consumo mínimo para ${formData.tipoConexao} é ${minimo} kW`;
                            }
                        }
                        break;
                        
                    case 5:
                        if (!formData.arquivoConta) newErrors.arquivoConta = 'Conta de energia é obrigatória';
                        
                        if (formData.tipoPessoa === 'fisica') {
                            if (!formData.arquivoRGFrente) newErrors.arquivoRGFrente = 'RG frente é obrigatório';
                            if (!formData.arquivoRGVerso) newErrors.arquivoRGVerso = 'RG verso é obrigatório';
                        } else {
                            if (!formData.contratoSocial) newErrors.contratoSocial = 'Contrato Social é obrigatório';
                            if (!formData.arquivoRGRep1Frente) newErrors.arquivoRGRep1Frente = 'RG Representante frente é obrigatório';
                            if (!formData.arquivoRGRep1Verso) newErrors.arquivoRGRep1Verso = 'RG Representante verso é obrigatório';
                        }
                        
                        if (!formData.aceiteTermoAdesao) newErrors.aceiteTermoAdesao = 'É necessário aceitar o termo';
                        if (!formData.aceiteDadosPessoais) newErrors.aceiteDadosPessoais = 'É necessário aceitar o tratamento de dados';
                        break;
                }
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            // ✅ MODIFICADA: Função handleNext agora salva a etapa antes de avançar
            const handleNext = async () => {
                if (!validateStep()) {
                    console.warn('⚠️ Validação falhou, não é possível prosseguir');
                    return;
                }

                // ✅ Salvar etapa atual antes de avançar
                const salvouComSucesso = await salvarEtapa(step);
                
                if (!salvouComSucesso) {
                    console.error('❌ Não foi possível salvar a etapa');
                    return;
                }

                // Se for a última etapa, mostrar revisão
                if (step === 5) {
                    setMostrarRevisao(true);
                    // Limpar localStorage após conclusão
                    localStorage.removeItem('oby_proposta_id');
                    console.log('🎉 PROPOSTA FINALIZADA! ID:', propostaId);
                } else {
                    // Avançar para próxima etapa
                    setStep(step + 1);
                    window.scrollTo(0, 0);
                }
            };

            if (mostrarRevisao) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-green-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full text-center">
                            <div className="mb-6">
                                <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <span className="text-4xl">✅</span>
                                </div>
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">Proposta Enviada!</h2>
                                <p className="text-gray-600 mb-4">Sua proposta foi registrada com sucesso</p>
                                <div className="bg-blue-50 p-4 rounded-lg mb-6">
                                    <p className="text-sm text-gray-700">
                                        <strong>ID da Proposta:</strong> {propostaId}
                                    </p>
                                </div>
                                <p className="text-gray-600 mb-6">
                                    Em breve nossa equipe entrará em contato para dar continuidade ao processo.
                                </p>
                            </div>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium"
                            >
                                Nova Proposta
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-green-50 py-8 px-4">
                    <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
                        <div className="mb-8">
                            <h1 className="text-3xl font-bold text-center mb-2 text-gray-800">OBY Energy</h1>
                            <p className="text-center text-gray-600">Proposta de Energia Solar</p>
                            
                            {propostaId && (
                                <div className="mt-4 bg-green-50 border border-green-200 rounded-lg p-3 text-center">
                                    <p className="text-sm text-green-700">
                                        📋 Proposta em andamento: <strong>{propostaId}</strong>
                                    </p>
                                </div>
                            )}
                        </div>

                        <div className="mb-8">
                            <div className="flex items-center justify-between mb-2">
                                {[1, 2, 3, 4, 5].map(s => (
                                    <div key={s} className="flex items-center flex-1">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold ${
                                            s <= step ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-400'
                                        }`}>
                                            {s}
                                        </div>
                                        {s < 5 && (
                                            <div className={`flex-1 h-1 mx-2 ${
                                                s < step ? 'bg-blue-600' : 'bg-gray-200'
                                            }`}></div>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-between text-xs text-gray-600 mt-2">
                                <span>Tipo</span>
                                <span>Dados</span>
                                <span>Endereço</span>
                                <span>Energia</span>
                                <span>Docs</span>
                            </div>
                        </div>

                        {step === 1 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold mb-6">Tipo de Pessoa</h2>
                                <div className="grid grid-cols-2 gap-6">
                                    <button
                                        onClick={() => setFormData({...formData, tipoPessoa: 'fisica'})}

                                                type="file" 
                                                name="arquivoRGFrente" 
                                                onChange={handleFileChange}
                                                accept=".pdf,.jpg,.jpeg,.png"
                                                className={`w-full p-3 border rounded-lg ${errors.arquivoRGFrente ? 'border-red-500' : 'border-gray-300'}`}
                                            />
                                            {formData.arquivoRGFrente && (
                                                <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGFrente.name}</p>
                                            )}
                                            {errors.arquivoRGFrente && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGFrente}</p>}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">RG/CNH Verso *</label>
                                            <input 
                                                type="file" 
                                                name="arquivoRGVerso" 
                                                onChange={handleFileChange}
                                                accept=".pdf,.jpg,.jpeg,.png"
                                                className={`w-full p-3 border rounded-lg ${errors.arquivoRGVerso ? 'border-red-500' : 'border-gray-300'}`}
                                            />
                                            {formData.arquivoRGVerso && (
                                                <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGVerso.name}</p>
                                            )}
                                            {errors.arquivoRGVerso && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGVerso}</p>}
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium mb-2">Contrato Social ou Ata de Eleição (PDF) *</label>
                                            <input 
                                                type="file" 
                                                name="contratoSocial" 
                                                onChange={handleFileChange}
                                                accept=".pdf"
                                                className={`w-full p-3 border rounded-lg ${errors.contratoSocial ? 'border-red-500' : 'border-gray-300'}`}
                                            />
                                            {formData.contratoSocial && (
                                                <p className="text-green-600 text-sm mt-1">✓ {formData.contratoSocial.name}</p>
                                            )}
                                            {errors.contratoSocial && <p className="text-red-500 text-sm mt-1">{errors.contratoSocial}</p>}
                                        </div>
                                        <div className="bg-gray-50 p-4 rounded-lg">
                                            <h3 className="font-bold mb-4">Documentos do Representante Legal</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">RG/CPF Frente *</label>
                                                    <input 
                                                        type="file" 
                                                        name="arquivoRGRep1Frente" 
                                                        onChange={handleFileChange}
                                                        accept=".pdf,.jpg,.jpeg,.png"
                                                        className={`w-full p-3 border rounded-lg ${errors.arquivoRGRep1Frente ? 'border-red-500' : 'border-gray-300'}`}
                                                    />
                                                    {formData.arquivoRGRep1Frente && (
                                                        <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRep1Frente.name}</p>
                                                    )}
                                                    {errors.arquivoRGRep1Frente && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRep1Frente}</p>}
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium mb-2">RG/CPF Verso *</label>
                                                    <input 
                                                        type="file" 
                                                        name="arquivoRGRep1Verso" 
                                                        onChange={handleFileChange}
                                                        accept=".pdf,.jpg,.jpeg,.png"
                                                        className={`w-full p-3 border rounded-lg ${errors.arquivoRGRep1Verso ? 'border-red-500' : 'border-gray-300'}`}
                                                    />
                                                    {formData.arquivoRGRep1Verso && (
                                                        <p className="text-green-600 text-sm mt-1">✓ {formData.arquivoRGRep1Verso.name}</p>
                                                    )}
                                                    {errors.arquivoRGRep1Verso && <p className="text-red-500 text-sm mt-1">{errors.arquivoRGRep1Verso}</p>}
                                                </div>
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div className="border-t pt-6 mt-6 space-y-3">
                                    <div className="bg-blue-50 p-4 rounded-lg">
                                        <label className="flex items-start cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                name="aceiteTermoAdesao" 
                                                checked={formData.aceiteTermoAdesao} 
                                                onChange={handleInputChange}
                                                className="mr-3 mt-1 w-5 h-5" 
                                            />
                                            <span className="text-sm">
                                                Estou ciente que serei o responsável pela assinatura do termo de adesão e do registro/assinatura do(a) representante legal da contraprestadora *
                                            </span>
                                        </label>
                                        {errors.aceiteTermoAdesao && <p className="text-red-500 text-sm mt-1">{errors.aceiteTermoAdesao}</p>}
                                    </div>
                                    <div className="bg-blue-50 p-4 rounded-lg">
                                        <label className="flex items-start cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                name="aceiteDadosPessoais" 
                                                checked={formData.aceiteDadosPessoais} 
                                                onChange={handleInputChange}
                                                className="mr-3 mt-1 w-5 h-5" 
                                            />
                                            <span className="text-sm">
                                                Autorizo o Tratamento de Dados Pessoais (conforme indicativo de acordo com a LGPD) *
                                            </span>
                                        </label>
                                        {errors.aceiteDadosPessoais && <p className="text-red-500 text-sm mt-1">{errors.aceiteDadosPessoais}</p>}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex justify-between mt-8 pt-6 border-t">
                            {step > 1 && (
                                <button 
                                    onClick={() => setStep(step - 1)} 
                                    disabled={loading}
                                    className="px-6 py-3 bg-gray-200 rounded-lg hover:bg-gray-300 disabled:opacity-50"
                                >
                                    Voltar
                                </button>
                            )}
                            <div className="flex-1"></div>
                            {step < 5 ? (
                                <button 
                                    onClick={handleNext} 
                                    disabled={loading}
                                    className="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {loading ? 'Salvando...' : 'Prosseguir'}
                                </button>
                            ) : (
                                <button 
                                    onClick={handleNext} 
                                    disabled={loading}
                                    className="px-8 py-3 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {loading ? 'Salvando...' : 'Finalizar Proposta'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<EnergyContractForm />, document.getElementById('root'));
    </script>
</body>
</html>
